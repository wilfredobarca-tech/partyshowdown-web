// Una medalla: el dibujo en su aro (sin nivel = silueta; secreto sin ganar = "???"), el nombre y los niveles.
function medalla(l, nuevo = false) {
  const oculto = l.secreto && !l.nivel;
  const tres = (l.metas?.length ?? 1) > 1;
  const pips = tres ? `<span class="pips">${[1, 2, 3].map((k) => `<i class="${l.nivel >= k ? "on n" + k : ""}"></i>`).join("")}</span>` : "";
  return `<button type="button" class="med n${l.nivel}${oculto ? " oculto" : ""}${nuevo ? " nuevo" : ""}" data-logro="${l.id}" aria-label="${esc(oculto ? "???" : nombreLogro(l.id))}">
    <span class="aro">${oculto ? `<b class="q">?</b>` : `<img src="${dibujoLogro(l.id)}" alt="" loading="lazy">`}</span>
    <span class="mn">${oculto ? "???" : esc(nombreLogro(l.id))}</span>${pips}</button>`;
}

// La vitrina del perfil: los 8 mejores (los recién ganados primero) y el botón para verlos todos.
function bloqueLogros(r, propio = false) {
  const L = listaLogros(r);
  if (!L.length) return "";
  const ganados = L.filter((l) => l.nivel), niveles = L.reduce((n, l) => n + l.nivel, 0), maxNiv = L.reduce((n, l) => n + (l.metas?.length ?? 1), 0);
  const nuevos = propio ? logrosNuevos(L) : new Set();
  const top = [...ganados].sort((a, b) => nuevos.has(b.id) - nuevos.has(a.id) || b.nivel - a.nivel || L.indexOf(a) - L.indexOf(b)).slice(0, 8);
  const huecos = L.filter((l) => !l.nivel && !l.secreto).slice(0, Math.max(0, 8 - top.length));
  return `<h3>${esc(TIT_VITRINA[TEMA][es_() ? 0 : 1])} <small>${t("lg_cuenta", ganados.length, L.length, niveles, maxNiv)}</small></h3>
    <div class="vitrina"><div class="meds">${[...top, ...huecos].map((l) => medalla(l, nuevos.has(l.id))).join("")}</div></div>
    <button class="btn btn-ghost mas-partidas" data-tab="logros">${t("lg_ver", L.length)}</button>`;
}

// La ficha de un logro (hoja de abajo): la medalla grande, qué pide, cuánto llevas y los tres niveles.
function abrirLogro(id) {
  const r = S.publico ? S.publico.resumen : S.resumen;
  const l = listaLogros(r).find((x) => x.id === id);
  if (!l) return;
  const oculto = l.secreto && !l.nivel;
  const info = LOGROS[id];
  const metas = l.metas ?? [1];
  const sig = metas.find((m) => l.valor < m);
  const desc = oculto ? t("lg_secreto") : info[es_() ? 4 : 5](sig ?? metas.at(-1));
  const avance = oculto || l.valor == null ? "" : sig ? `<div class="avance"><div class="barra"><i style="width:${Math.min(100, (100 * l.valor) / sig)}%"></i></div><small>${t("lg_llevas", l.valor, sig)}</small></div>` : `<p class="hecho">${t("lg_completo")}</p>`;
  const niveles = metas.length > 1 && !oculto ? `<div class="niveles">${metas.map((m, k) => `<div class="niv${l.nivel > k ? " on" : ""} n${k + 1}"><i></i><b>${[t("lg_bronce"), t("lg_plata"), t("lg_oro")][k]}</b><small>${m}</small></div>`).join("")}</div>` : "";
  const burla = BURLAS[id] && l.nivel ? `<div class="admin-say">${cerdo("admin_burlon")}<div class="bubble">${esc(BURLAS[id][es_() ? 0 : 1])}</div></div>` : "";
  const H = document.createElement("div");
  H.className = "hoja"; H.setAttribute("role", "dialog"); H.setAttribute("aria-modal", "true");
  H.innerHTML = `<div class="caja2 ficha">${medalla(l).replace("<button", "<div").replace("</button>", "</div>")}
    <h2>${oculto ? "???" : esc(nombreLogro(id))}</h2><p>${esc(desc)}</p>${avance}${niveles}${burla}
    <button class="btn btn-oro" type="button" data-cerrar>${t("cerrar")}</button></div>`;
  const cerrar = () => { H.remove(); document.removeEventListener("keydown", tecla); };
  const tecla = (e) => { if (e.key === "Escape") cerrar(); };
  H.addEventListener("click", (e) => { if (e.target === H || e.target.closest("[data-cerrar]")) cerrar(); });
  document.addEventListener("keydown", tecla);
  document.body.appendChild(H);
  H.querySelector("[data-cerrar]").focus();
}

// Los niveles nuevos desde la última vez que se vio el perfil propio (en este navegador). La primera vez no
// se festeja nada: se guarda lo que hay.
function logrosNuevos(L) {
  const clave = "ps_logros_" + (S.jugador?.codigo ?? "");
  let antes = null;
  try { antes = JSON.parse(guardado.get(clave)); } catch {}
  const ahora = Object.fromEntries(L.map((l) => [l.id, l.nivel]));
  guardado.set(clave, JSON.stringify(ahora));
  if (!antes) return new Set();
  const nuevos = new Set(L.filter((l) => l.nivel > (antes[l.id] ?? 0)).map((l) => l.id));
  if (nuevos.size) setTimeout(() => aviso(nuevos.size === 1 ? t("lg_nuevo", nombreLogro([...nuevos][0])) : t("lg_nuevos", nuevos.size)), 2600);
  return nuevos;
}

const DATO_STATS = [["stolen", "d_robo"], ["robbed", "d_robado"], ["reds", "d_rojas"], ["buys", "d_compras"], ["lost", "d_perdio"]];
async function abrirPartida(id) {
  const volver = S.tab;
  pintar(vistaCargando(t("cargando")));
  try { S.detalle = { ...(await api("GET", "/partida/" + id)), volver }; }
  catch (e) {
    if (e.status === 401) { salirLocal(); return pintar(vistaEntrar()); }
    S.detalle = null; aviso(e.message === "no_existe" ? t("res_no_existe") : t("err_red"));
    return pintar(S.publico ? vistaPublico() : vistaPerfil());
  }
  pintar(vistaPartida());
}

  const dueno = (S.publico?.jugador ?? S.jugador)?.codigo;
  const fmt = new Intl.DateTimeFormat(lang === "es" ? "es" : "en", { weekday: "short", day: "numeric", month: "short" });
  const sub = [P.modo === "rapido" ? t("rapido", P.turnos) : t("tablero", P.turnos), TEMA_INFO[P.mapa] ? ti("nombre", P.mapa) : "", P.en_linea ? t("en_linea") : t("local")].filter(Boolean).join(" · ");
  const quien = (j) => j.codigo ? `<a href="?j=${j.codigo}">${esc(j.nombre)}</a>` : esc(j.nombre);
  const porPuesto = new Map(J.map((j) => [j.puesto, j]));
  // el podio: 2.º, 1.º, 3.º
  const pod = (j, n) => j ? `<div class="pod p${n}${j.codigo && j.codigo === dueno ? " yo" : ""}">${n === 1 ? `<img class="corona" src="tema/feria/estrella.webp" alt="">` : ""}${avatar("av", j.personaje, j.nombre)}
      <div class="pn">${quien(j)}${j.bot ? ` <small>${t("bot")}</small>` : ""}</div><div class="pd">${ticketIcon}${j.dorados}</div>
      <div class="base"><b>${n}</b></div></div>` : `<div class="pod p${n} vacio-pod"></div>`;
  const resto = J.filter((j) => j.lugar > 3);
  // la noche en números: los títulos primero, después los contadores del tablero
  const datos = [];
  for (const j of J) {
    if (j.titulo && TITULOS[j.titulo]) datos.push([j, TITULOS[j.titulo][lang === "es" ? 0 : 1], ""]);
    const s = j.stats || {};
    for (const [k, txt] of DATO_STATS) if ((s[k] ?? 0) > 0) datos.push([j, t(txt, s[k]), "chico"]);
    if ((s.rolls ?? 0) >= 3) datos.push([j, t("d_dado", (s.dice / s.rolls).toFixed(1)), "chico"]);
  }
  const noche = datos.filter((d) => !d[2]).concat(datos.filter((d) => d[2]).sort((a, b) => a[0].lugar - b[0].lugar)).slice(0, 12);
  // minijuego por minijuego
  const mio = J.find((j) => j.codigo && j.codigo === dueno);
  const rondaHtml = (r, i) => {
    const orden = [...r.lugares].sort((a, b) => a[1] - b[1]);
    const g = porPuesto.get(orden[0]?.[0]);
    const miLugar = mio ? r.lugares.find((l) => l[0] === mio.puesto)?.[1] : null;
    const foto = FOTOS[r.minijuego] ? ` style="background-image:url(../media/j_${FOTOS[r.minijuego]}.jpg)"` : "";
    return `<div class="mj ronda${miLugar && miLugar > 1 ? " malo" : ""}" style="--c1:${["#e0162e", "#3d8bff", "#2fcb86"][i % 3]}">
      <div class="th"${foto}>${foto ? "" : esc([...nombreMj(r.minijuego).replace(/^[¡¿]/, "")][0])}</div>
      <div class="n">${esc(nombreMj(r.minijuego))}<small>${t("ronda_n", r.ronda)}${g ? " · " + esc(t("gano_x", g.nombre)) : ""}</small>
        <div class="fila-av">${orden.map((l) => { const j = porPuesto.get(l[0]); return j ? avatar("a mini-av" + (l[1] === 1 ? " gana-av" : ""), j.personaje, j.nombre) : ""; }).join("")}</div></div>
      ${miLugar ? `<span class="pct">${esc(t("lugar", miLugar))}</span>` : ""}</div>`;
  };
  return barra() + `<main class="main resumen">
    <button class="btn btn-ghost volver" data-accion="volver_partida">← ${t("volver")}</button>
    <div class="letrero"><b>${esc(ti("res")(fmt.format(new Date(P.fecha))))}</b><span>${esc(sub)}</span></div>
    <div class="podio">${pod(J.find((j) => j.lugar === 2), 2)}${pod(J.find((j) => j.lugar === 1), 1)}${pod(J.find((j) => j.lugar === 3), 3)}</div>
    ${resto.length ? `<div class="partidas">${resto.map((j) => `<div class="pt"><div class="lug">${esc(t("lugar", j.lugar))}</div><div class="n">${quien(j)}${j.bot ? `<small>${t("bot")}</small>` : ""}</div><div class="dor">${ticketIcon}${j.dorados}</div></div>`).join("")}</div>` : ""}
    ${noche.length ? `<h3>${t("res_noche")}</h3><div class="datos">${noche.map(([j, txt, c]) => `<div class="dato ${c}">${avatar("a", j.personaje, j.nombre)}<div><b>${esc(txt)}</b><small>${esc(j.nombre)}</small></div></div>`).join("")}</div>` : ""}
    ${rondas.length ? `<h3>${t("res_mj")} <small>${t("res_mj_sub", rondas.length)}</small></h3><div class="mjs">${rondas.map(rondaHtml).join("")}</div>` : ""}
    ${P.completa ? "" : `<p class="nota">${t("res_incompleta")}</p>`}
  </main>`;
}

// ================================================================= botones
function conectar() {
  app.querySelectorAll("[data-lang]").forEach((b) => b.addEventListener("click", () => {
    lang = b.dataset.lang; guardado.set("ps_lang", lang);
    document.documentElement.lang = lang; document.title = t("titulo_pag");
    repintar();
  }));
  app.querySelectorAll("[data-tab]").forEach((b) => b.addEventListener("click", () => {
    S.tab = b.dataset.tab;
    pintar(vistaPerfil());
    if (S.tab === "amigos") cargarAmigos();     // (siempre al día: alguien pudo aceptar mientras tanto)
  }));
  app.querySelectorAll("[data-accion]").forEach((b) => b.addEventListener("click", () => acciones[b.dataset.accion]?.(b)));
  app.querySelectorAll("[data-partida]").forEach((b) => b.addEventListener("click", () => abrirPartida(b.dataset.partida)));
  app.querySelectorAll("[data-logro]").forEach((b) => b.addEventListener("click", () => abrirLogro(b.dataset.logro)));
  const fa = document.getElementById("form-agregar");
  fa?.addEventListener("submit", (e) => {
    e.preventDefault();
    const c = fa.querySelector("#num-amigo").value.toUpperCase().replace(/[^A-Z0-9]/g, "");
    if (!c) return fa.querySelector("#num-amigo").focus();
    accionAmigo("/amigos/agregar", { codigo: c }, fa.querySelector("button"));
  });
  const form = document.getElementById("form-perfil");
  if (form) {
    const nombre = form.querySelector("#nombre"), pista = form.querySelector("#pista");
    form.querySelectorAll("[data-pj]").forEach((b) => b.addEventListener("click", () => {
      elegido = b.dataset.pj;
      form.querySelectorAll("[data-pj]").forEach((x) => x.setAttribute("aria-checked", x === b));
      form.querySelector("#pj-nombre").textContent = nombrePj(elegido);
      form.querySelectorAll(".opt-pj").forEach((im) => (im.src = retrato(elegido, im.closest("[data-tema-opt]").dataset.temaOpt)));
    }));
    // el tema se prueba al tocarlo: cambia la escena, los retratos y Mr. Admin
    form.querySelectorAll("[data-tema-opt]").forEach((b) => b.addEventListener("click", () => {
      TEMA_PRUEBA = b.dataset.temaOpt;
      form.querySelectorAll("[data-tema-opt]").forEach((x) => x.setAttribute("aria-checked", x === b));
      ponerTema(); vestir();
      form.querySelectorAll("[data-pj]").forEach((x) => (x.style.backgroundImage = `url(${retrato(x.dataset.pj)})`));
      const c = app.querySelector(".crear .cerdo img"); if (c) c.src = `../media/${TEMA_INFO[TEMA].admin}.webp`;
    }));
    nombre.addEventListener("input", () => { pista.className = "pista"; pista.textContent = t("nombre_pista"); });
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const n = nombre.value.replace(/\s+/g, " ").trim();
      if (!/^[\p{L}\p{N} ._-]{2,12}$/u.test(n)) { pista.className = "pista mal"; pista.textContent = t("nombre_mal"); nombre.focus(); return; }
      const btn = form.querySelector("#guardar");
      btn.disabled = true; btn.textContent = t("guardando");
      try {
        const r = await api("POST", "/yo", { nombre: n, personaje: elegido, tema: TEMA_PRUEBA ?? "auto" });
        S.jugador = r.jugador; S.resumen = r.resumen; S.tab = "perfil"; TEMA_PRUEBA = null;
        mostrarPerfil();
      } catch (err) {
        btn.disabled = false; btn.textContent = t("guardar");
        if (err.status === 401) { salirLocal(); return pintar(vistaEntrar()); }
        pista.className = "pista mal"; pista.textContent = err.message === "nombre" ? t("nombre_mal") : t("err_red");
      }
    });
  }
}

function repintar() {
  if (!API && !DEMO) return pintar(vistaPronto());
  if (S.publico) return pintar(vistaPublico());
  if (S.detalle?.partida) return pintar(vistaPartida());
  if (document.getElementById("form-perfil")) return pintar(vistaCrear());
  if (S.jugador) return pintar(vistaPerfil());
  pintar(vistaEntrar());
}

const acciones = {
  steam: () => irASteam(),
  editar: () => { TEMA_PRUEBA = null; pintar(vistaCrear()); },
  cancelar: () => { TEMA_PRUEBA = null; pintar(vistaPerfil()); },
  tema: () => abrirHoja(),
  async salir() {
    try { await api("POST", "/salir"); } catch {}
    salirLocal(); pintar(vistaEntrar());
  },
  agregar: (b) => accionAmigo("/amigos/agregar", { codigo: b.dataset.c }, b),
  aceptar: (b) => accionAmigo("/amigos/responder", { codigo: b.dataset.c, aceptar: true }, b),
  rechazar: (b) => accionAmigo("/amigos/responder", { codigo: b.dataset.c, aceptar: false }, b),
  quitar: (b) => accionAmigo("/amigos/quitar", { codigo: b.dataset.c }, b),
  mi_qr: () => mostrarQr(),
  async confirmar_pend(b) {
    b.disabled = true;
    try {
      await api("POST", "/" + S.pend.k + "/" + S.pend.c);
      S.pend.hecho = true;
    } catch (e) {
      if (e.status === 401) { salirLocal(); return pintar(vistaEntrar()); }
      S.pend.error = { vencido: t("vencido"), ocupado: S.pend.k === "vincular" ? t("usado") : t("asi_ocupado"), otra_cuenta: t("vin_otra"),
        es_tu_pc: t("asi_tu_pc"), no_existe: t("usado") }[e.message] ?? t("err_red");
    }
    pintar(vistaPendiente());
  },
  fin_pend() { terminarPendiente(); S.pend = null; S.tab = "perfil"; mostrarPerfil(); },
  volver_partida: () => { const v = S.detalle?.volver ?? "perfil"; S.detalle = null; if (S.publico) return pintar(vistaPublico()); S.tab = v; pintar(vistaPerfil()); },
  ver_todos: () => { S.verTodos = !S.verTodos; pintar(S.publico ? vistaPublico() : vistaPerfil(), false); },
  async compartir() {
    const url = location.origin + location.pathname + "?j=" + S.jugador.codigo;
    try {
      if (navigator.share) await navigator.share({ title: "Party Showdown", text: S.jugador.nombre, url });
      else { await navigator.clipboard.writeText(url); aviso(t("copiado")); }
    } catch {}
  },
};

function aviso(txt) {
  const d = document.createElement("div");
  d.className = "toast"; d.setAttribute("role", "status"); d.textContent = txt;
  document.body.appendChild(d);
  setTimeout(() => d.remove(), 1800);
}

arrancar();
</script>
</body>
</html>
