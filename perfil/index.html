<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Perfil de jugador · Party Showdown</title>
<meta name="description" content="Tu perfil de Party Showdown: victorias, tickets dorados, tus minijuegos y tus revanchas. Se llena solo cada vez que juegas.">
<meta name="theme-color" content="#0A0610">
<meta property="og:title" content="Perfil de jugador · Party Showdown">
<meta property="og:image" content="https://partyshowdown.com/media/og.jpg">
<link rel="icon" href="../media/favicon.png">
<style>
@font-face { font-family: "Luckiest"; src: url("../fonts/LuckiestGuy-Regular.ttf"); font-display: swap; }
@font-face { font-family: "Fredoka"; src: url("../fonts/Fredoka.ttf"); font-weight: 300 700; font-display: swap; }

:root {
  --night: #0A0610; --night-2: #140B1E; --night-3: #1F1030;
  --blood: #E0162E; --blood-2: #8E0A1A; --gold: #FFC83D; --gold-2: #FFE7A3;
  --bone: #F5EBDD; --cream: #FBF3E4; --ink: #1A0F1F; --muted: #B9A9C9; --muted-2: #6d5e78;
  --uva: #6B4BD8; --cielo: #3D8BFF; --menta: #2FCB86; --rosa: #FF4E9A; --rojo: #F2484B; --steam: #1b2838;
}
* { box-sizing: border-box; }
html { background: var(--night); }
body { margin: 0; min-height: 100svh; background: var(--night); color: var(--bone); font: 16px/1.4 "Fredoka", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
img { display: block; max-width: 100%; height: auto; }
button { font: inherit; color: inherit; cursor: pointer; }
.d { font-family: "Luckiest", "Fredoka", sans-serif; font-weight: normal; text-transform: uppercase; letter-spacing: .4px; line-height: 1; }
[hidden] { display: none !important; }

/* en pantallas grandes: la feria de fondo y la app al centro */
.app { position: relative; z-index: 1; max-width: 460px; min-height: 100svh; margin: 0 auto; background: var(--night-2); box-shadow: 0 0 0 1px rgba(255,255,255,.06), 0 0 120px rgba(224,22,46,.15); display: flex; flex-direction: column; }

/* barra de arriba */
.top { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: calc(10px + env(safe-area-inset-top)) 16px 10px; background: rgba(20,11,30,.92); backdrop-filter: blur(10px); }
.top .marca img { height: 40px; width: auto; }
.top-r { display: flex; align-items: center; gap: 8px; }
.lang { display: flex; background: rgba(255,255,255,.08); border: 2px solid rgba(255,255,255,.16); border-radius: 999px; padding: 2px; }
.lang button { border: 0; background: none; font-weight: 700; font-size: 13px; padding: 4px 9px; border-radius: 999px; }
.lang button.on { background: var(--bone); color: var(--ink); }

/* botones */
.btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; border: 3px solid #000; border-radius: 14px; box-shadow: 0 6px 0 #000; padding: 15px 18px; font-weight: 700; font-size: 18px; text-decoration: none; transition: transform .1s, box-shadow .1s; }
.btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #000; }
.btn svg { width: 26px; height: 26px; flex: none; }
.btn-steam { background: var(--steam); color: #fff; }
.btn-oro { background: var(--gold); color: var(--ink); font: normal 22px/1 "Luckiest"; padding: 16px 18px 12px; text-transform: uppercase; }
.btn-ghost { background: rgba(255,255,255,.06); color: var(--bone); border-color: rgba(255,255,255,.28); box-shadow: none; font-size: 15px; padding: 11px 14px; border-width: 2px; }
.btn-ghost:active { transform: none; background: rgba(255,255,255,.12); }
.btn[disabled] { opacity: .6; pointer-events: none; }
.fila-btn { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.bubble { background: var(--cream); color: var(--ink); font-weight: 600; font-size: 15px; padding: 10px 14px; border-radius: 14px; border: 3px solid #000; box-shadow: 0 4px 0 #000; }
.admin-say { display: flex; align-items: flex-end; gap: 6px; }
.admin-say img { width: 72px; flex: none; filter: drop-shadow(0 0 18px rgba(224,22,46,.45)); }

/* pantalla de entrada */
.entrar { position: relative; flex: 1; display: flex; flex-direction: column; background: url("../media/feria_limpio.jpg") center top/cover; }
.entrar::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,6,16,.55) 0, rgba(10,6,16,.55) 26%, rgba(10,6,16,.94) 58%, var(--night) 100%); }
.entrar .in { position: relative; flex: 1; display: flex; flex-direction: column; align-items: center; text-align: center; padding: 26px 24px calc(30px + env(safe-area-inset-bottom)); }
.entrar .logo { width: min(240px, 62vw); filter: drop-shadow(0 6px 0 rgba(0,0,0,.5)); }
.entrar .cerdo { width: min(200px, 50vw); margin-top: 6px; filter: drop-shadow(0 0 30px rgba(224,22,46,.55)); -webkit-mask-image: linear-gradient(180deg, #000 72%, transparent 100%); mask-image: linear-gradient(180deg, #000 72%, transparent 100%); }
.entrar h1 { font-size: clamp(34px, 10vw, 44px); margin: 4px 0 0; text-shadow: 0 4px 0 var(--blood-2), 0 8px 0 #000; }
.entrar h1 em { font-style: normal; color: var(--gold); }
.entrar p { font-size: 17px; color: var(--gold-2); font-weight: 500; margin: 14px 0 28px; max-width: 340px; }
.entrar .btn { margin-top: auto; max-width: 360px; }
.nada { margin-top: 14px; font-size: 14px; color: var(--muted); }
.nada b { color: var(--bone); }
.aviso { margin-top: 14px; color: #fff; background: var(--blood); border: 2px solid #000; border-radius: 10px; padding: 8px 12px; font-weight: 600; font-size: 14px; }

/* contenido con scroll */
.main { flex: 1; padding: 8px 16px 24px; }
.cargando { flex: 1; display: grid; place-items: center; color: var(--muted); font-weight: 600; letter-spacing: 2px; text-transform: uppercase; font-size: 14px; }
.cargando i { display: block; width: 46px; height: 46px; margin: 0 auto 14px; border-radius: 50%; border: 4px solid rgba(255,200,61,.2); border-top-color: var(--gold); animation: gira .8s linear infinite; }
@keyframes gira { to { transform: rotate(1turn) } }

/* la tarjeta-ticket */
.ticket { position: relative; background: var(--cream); color: var(--ink); border-radius: 22px; border: 4px solid #000; box-shadow: 0 7px 0 #000; }
.ticket .head { position: relative; background: var(--cielo); border-radius: 17px 17px 0 0; padding: 14px 16px 16px; display: flex; align-items: center; gap: 14px; border-bottom: 3px dashed rgba(0,0,0,.35); }
.ticket .muesca { position: absolute; bottom: -15px; width: 26px; height: 26px; border-radius: 50%; background: var(--night-2); border: 4px solid #000; z-index: 2; }
.ticket .muesca.i { left: -17px; clip-path: inset(0 0 0 50%); }
.ticket .muesca.d { right: -17px; clip-path: inset(0 50% 0 0); }
.av { width: 82px; height: 82px; border-radius: 50%; border: 4px solid #000; background: #fff center/cover; box-shadow: 0 4px 0 rgba(0,0,0,.5); flex: none; display: grid; place-items: center; font: normal 36px "Luckiest"; color: #fff; }
.who { min-width: 0; }
.who .name { font-size: clamp(26px, 8vw, 34px); color: #fff; text-shadow: 0 3px 0 #000; overflow-wrap: anywhere; }
.pill { display: inline-block; margin-top: 7px; background: var(--uva); color: #fff; font-weight: 700; font-size: 12.5px; letter-spacing: 1px; padding: 4px 11px; border-radius: 999px; border: 2px solid #000; text-transform: uppercase; }
.no { position: absolute; right: 14px; top: 12px; font: normal 14px "Luckiest"; color: rgba(0,0,0,.4); }
.stats { display: grid; grid-template-columns: 1fr 1fr 1fr; padding: 18px 6px 16px; text-align: center; }
.stats > div { min-width: 0; padding: 0 6px; }
.stats > div + div { border-left: 2px dashed rgba(26,15,31,.18); }
.stats b { display: flex; align-items: center; justify-content: center; gap: 4px; font: normal clamp(28px, 8.5vw, 34px)/1 "Luckiest"; }
.stats b.oro { color: #E3A400; }
.stats b svg { width: 24px; height: 24px; }
.stats span { display: block; margin-top: 6px; line-height: 1.25; font-size: 12px; font-weight: 700; letter-spacing: 1px; color: #7c6d86; text-transform: uppercase; }

h3 { font: normal 19px "Luckiest"; color: var(--bone); letter-spacing: .6px; margin: 26px 2px 10px; text-shadow: 0 2px 0 #000; text-transform: uppercase; }
h3 small { font-family: "Fredoka"; font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: 0; text-transform: none; margin-left: 6px; text-shadow: none; }
.duo { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.mg { border-radius: 16px; overflow: hidden; border: 3px solid #000; box-shadow: 0 5px 0 #000; background: var(--cream); color: var(--ink); }
.mg .img { height: 80px; background: var(--night-3) center/cover; position: relative; }
.mg .tag { position: absolute; left: 8px; top: 8px; font-weight: 700; font-size: 11px; letter-spacing: 1px; padding: 3px 8px; border-radius: 999px; border: 2px solid #000; color: #fff; text-transform: uppercase; }
.mg .t { padding: 8px 10px 9px; }
.mg .t b { display: block; font: normal 15px/1.1 "Luckiest"; text-transform: uppercase; }
.mg .t span { font-size: 13px; color: var(--muted-2); font-weight: 600; }

.caja { background: rgba(255,255,255,.06); border: 2px solid rgba(255,255,255,.12); border-radius: 16px; padding: 4px 12px; }
.r { display: flex; align-items: center; gap: 12px; padding: 10px 0; }
.r + .r { border-top: 1px solid rgba(255,255,255,.1); }
.r .a { width: 44px; height: 44px; border-radius: 50%; border: 3px solid #000; background: #fff center/cover; flex: none; display: grid; place-items: center; font: normal 20px "Luckiest"; color: #fff; }
.r .n { flex: 1; min-width: 0; font-weight: 600; font-size: 16px; }
.r .n small { display: block; color: var(--muted); font-size: 12.5px; font-weight: 500; }
.score { font: normal 21px/1 "Luckiest"; padding: 7px 10px 4px; border-radius: 10px; border: 2px solid #000; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.35); white-space: nowrap; }
.win { background: var(--menta); } .lose { background: var(--rojo); } .tie { background: var(--gold); color: var(--ink); text-shadow: none; }

.vacio { text-align: center; padding: 22px 16px 8px; color: var(--muted); }
.vacio .admin-say { justify-content: center; margin-top: 4px; text-align: left; }
.acciones { margin-top: 26px; display: flex; flex-direction: column; gap: 10px; }
.quip { margin-top: 26px; }

/* partidas */
.partida { display: flex; align-items: center; gap: 12px; padding: 12px 0; }
.partida + .partida { border-top: 1px solid rgba(255,255,255,.1); }
.lugar { width: 52px; height: 52px; flex: none; border-radius: 14px; border: 3px solid #000; display: grid; place-items: center; font: normal 20px/1 "Luckiest"; color: var(--ink); background: var(--bone); padding-top: 3px; }
.lugar.l1 { background: var(--gold); box-shadow: 0 0 18px rgba(255,200,61,.45); }
.partida .n { flex: 1; min-width: 0; font-weight: 600; }
.partida .n small { display: block; color: var(--muted); font-weight: 500; font-size: 13px; }
.mini-oro { display: flex; align-items: center; gap: 4px; font: normal 18px "Luckiest"; color: var(--gold); }
.mini-oro svg { width: 20px; height: 20px; }

/* sentarme */
.pasos { counter-reset: p; display: flex; flex-direction: column; gap: 12px; margin-top: 6px; }
.paso { display: flex; gap: 14px; align-items: flex-start; background: rgba(255,255,255,.06); border: 2px solid rgba(255,255,255,.12); border-radius: 16px; padding: 14px; }
.paso::before { counter-increment: p; content: counter(p); flex: none; width: 36px; height: 36px; border-radius: 50%; background: var(--gold); color: var(--ink); border: 3px solid #000; display: grid; place-items: center; font: normal 18px/1 "Luckiest"; padding-top: 3px; }
.paso p { margin: 6px 0 0; }
.qr-ticket { margin: 4px auto 0; width: 210px; }
.nota { color: var(--muted); font-size: 14px; margin: 16px 2px 0; }
.sello { display: inline-block; margin-top: 18px; background: var(--blood); color: #fff; font-weight: 700; font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase; padding: 7px 12px; border-radius: 6px; border: 2px solid #000; transform: rotate(-2deg); box-shadow: 0 4px 0 #000; }

/* crear perfil */
.crear h2 { font-size: 36px; margin: 10px 0 6px; color: var(--gold); text-shadow: 0 4px 0 #000; }
.crear .sub { color: var(--muted); margin: 0 0 20px; }
.lbl { display: block; font: normal 16px "Luckiest"; letter-spacing: .6px; text-transform: uppercase; margin: 18px 2px 8px; }
.campo { width: 100%; font: 700 22px "Fredoka"; color: var(--ink); background: var(--cream); border: 3px solid #000; border-radius: 14px; padding: 12px 14px; box-shadow: 0 4px 0 #000; outline: none; }
.campo:focus { box-shadow: 0 4px 0 #000, 0 0 0 4px rgba(255,200,61,.55); }
.pista { font-size: 13px; color: var(--muted); margin: 8px 2px 0; }
.pista.mal { color: #ff8a8f; font-weight: 600; }
.grilla { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.pj { position: relative; aspect-ratio: 1; border-radius: 50%; border: 3px solid #000; background: #fff center/cover; padding: 0; box-shadow: 0 4px 0 #000; transition: transform .12s; }
.pj[aria-checked="true"] { outline: 4px solid var(--gold); outline-offset: 2px; transform: scale(1.04); }
.pj-nombre { text-align: center; margin: 12px 0 0; font: normal 18px "Luckiest"; color: var(--gold); text-transform: uppercase; }
.crear .btn-oro { margin-top: 24px; }
.crear .admin-say { margin-top: 22px; }

/* pestañas */
.tabs { position: sticky; bottom: 0; z-index: 10; display: grid; grid-template-columns: 1fr 1fr 1fr; padding: 8px 10px calc(10px + env(safe-area-inset-bottom)); background: rgba(10,6,16,.96); border-top: 2px solid rgba(224,22,46,.35); }
.tabs button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--muted); font-size: 12px; font-weight: 600; padding: 4px 0; }
.tabs svg { width: 24px; height: 24px; }
.tabs .on { color: var(--gold); }
.tabs .mid i { display: grid; place-items: center; width: 54px; height: 54px; margin-top: -26px; border-radius: 50%; background: var(--gold); color: var(--ink); border: 3px solid #000; box-shadow: 0 4px 0 #000; }
.tabs .mid.on i { box-shadow: 0 4px 0 #000, 0 0 0 4px rgba(255,200,61,.35); }
.tabs .mid i svg { width: 28px; height: 28px; }

.cursor { display: inline-block; width: 2px; height: 1em; background: var(--ink); vertical-align: -2px; margin-left: 1px; }
.barra { height: 6px; margin-top: 6px; border-radius: 3px; background: rgba(255,255,255,.1); overflow: hidden; }
.barra i { display: block; height: 100%; width: 0; border-radius: 3px; background: currentColor; box-shadow: 0 0 8px currentColor; transition: width 1.1s cubic-bezier(.2,.8,.2,1); }
.mjl.visto .barra i { width: var(--p); }
.mjl .r:nth-child(2) .barra i { transition-delay: .15s; } .mjl .r:nth-child(3) .barra i { transition-delay: .3s; }
.barra.alto { color: #2FCB86; } .barra.medio { color: #FFC83D; } .barra.bajo { color: #F2484B; }
@media (prefers-reduced-motion: reduce) { .ticket.gano .brillo { animation: none; } .barra i { transition: none; } }

/* minijuegos */
.sub-h { margin: 6px 2px 8px; font-size: 13px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); }
.sub-h.verde { color: var(--menta); } .sub-h.rojo { color: #ff7b7e; }
.caja.mjl + .sub-h { margin-top: 16px; }
.mjl .th { width: 48px; height: 48px; flex: none; border-radius: 12px; border: 2px solid #000; background: var(--night-3) center/cover; display: grid; place-items: center; font: normal 20px/1 "Luckiest"; color: var(--muted); padding-top: 3px; }
.pct { flex: none; min-width: 60px; text-align: center; font: normal 19px/1 "Luckiest"; padding: 7px 8px 4px; border-radius: 10px; border: 2px solid #000; background: rgba(255,255,255,.08); color: var(--muted); }
.pct.alto { background: var(--menta); color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.3); }
.pct.medio { background: var(--gold); color: var(--ink); }
.pct.bajo { background: var(--rojo); color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.3); }
.r.hueco .n i { display: block; width: 62%; height: 12px; border-radius: 6px; background: rgba(255,255,255,.12); }
.r.hueco .n small i { width: 38%; height: 9px; margin-top: 8px; background: rgba(255,255,255,.07); }
.ver-todos { margin-top: 12px; }

/* amigos */
.tabs button { position: relative; }
.insignia { position: absolute; top: -4px; left: calc(50% + 6px); min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; background: var(--blood); color: #fff; border: 2px solid #000; font-size: 11px; font-weight: 700; display: grid; place-items: center; }
.r .n a { color: inherit; text-decoration: none; }
.tabla .pos { width: 24px; flex: none; text-align: center; font: normal 20px/1 "Luckiest"; color: var(--muted); padding-top: 3px; }
.tabla .pos.p1 { color: var(--gold); }
.tabla .r.yo { background: rgba(255,200,61,.1); margin: 0 -12px; padding-left: 12px; padding-right: 12px; }
.tabla .v { text-align: right; font: normal 22px/1 "Luckiest"; flex: none; }
.tabla .v small { display: block; margin-top: 4px; font: 600 12px "Fredoka"; color: var(--muted); }
.tu { display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 999px; background: var(--gold); color: var(--ink); font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; vertical-align: 2px; }
.mini { flex: none; border: 2px solid #000; border-radius: 10px; padding: 7px 11px; font-weight: 700; font-size: 14px; box-shadow: 0 3px 0 #000; }
.mini:active { transform: translateY(2px); box-shadow: 0 1px 0 #000; }
.mini.si { background: var(--menta); color: #fff; }
.mini.oro { background: var(--gold); color: var(--ink); }
.mini.gris { background: rgba(255,255,255,.08); color: var(--bone); border-color: rgba(255,255,255,.3); box-shadow: none; }
.mini[disabled] { opacity: .55; pointer-events: none; }
.fila-mini { display: flex; gap: 8px; }
.agregar-num { display: flex; gap: 10px; margin-top: 4px; }
.agregar-num .campo { flex: 1; min-width: 0; font-size: 20px; padding: 10px 12px; }
.agregar-num .btn { width: auto; flex: none; padding: 10px 16px; font-size: 16px; }
.caja.pad { padding: 14px; }
.caja.pad .fila-btn { margin-top: 12px; }
.caja.pad .pista { margin-top: 10px; }
.relacion { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
.btn-menta { background: var(--menta); color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.3); }
.estado-amigo { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 12px; border-radius: 14px; border: 2px dashed rgba(255,255,255,.3); color: var(--bone); font-weight: 700; }
.modal { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 16px; background: rgba(10,6,16,.88); }
.modal .ticket { width: min(340px, 100%); text-align: center; padding-bottom: 18px; }
.modal .head { justify-content: center; flex-direction: column; gap: 8px; }
.modal p { color: var(--muted-2); font-weight: 600; margin: 4px 18px 0; }
.qr { width: 236px; height: 236px; margin: 22px auto 8px; padding: 10px; background: #fff; border: 3px solid #000; border-radius: 12px; }
.qr svg { display: block; width: 100%; height: 100%; }
.modal .btn { width: calc(100% - 36px); margin: 16px auto 0; }

/* pantallas del QR del juego */
.pend { text-align: center; padding-top: 20px; }
.pend h2 { font-size: clamp(34px, 10vw, 46px); color: var(--gold); text-shadow: 0 5px 0 #000, 0 0 40px rgba(255,200,61,.35); margin: 8px 0 22px; }
.pend .ticket { text-align: left; }
.pend .pend-head { flex-direction: column; justify-content: center; background: var(--menta); padding: 20px 16px; gap: 10px; }
.pend .pend-head .av { width: 108px; height: 108px; }
.pend .pend-head .name { font-size: 34px; color: #fff; text-shadow: 0 3px 0 #000; }
.pend .rows { padding: 12px 18px 14px; }
.pend .rows div { display: flex; justify-content: space-between; padding: 7px 0; font-size: 15px; color: var(--muted-2); font-weight: 600; }
.pend .rows div + div { border-top: 2px dashed rgba(26,15,31,.14); }
.pend .rows b { color: var(--ink); }
.pend .admin-say { margin-top: 20px; text-align: left; }
.pend .aviso { margin-top: 18px; }
.check { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; letter-spacing: 3px; color: var(--menta); text-transform: uppercase; }
.check i { width: 10px; height: 10px; border-radius: 50%; background: var(--menta); box-shadow: 0 0 12px var(--menta); }

.toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 30; background: var(--cream); color: var(--ink); font-weight: 700; padding: 10px 16px; border-radius: 12px; border: 3px solid #000; box-shadow: 0 4px 0 #000; }
.demo { position: fixed; left: 50%; transform: translateX(-50%); top: calc(4px + env(safe-area-inset-top)); z-index: 40; pointer-events: none; background: var(--uva); color: #fff; font-weight: 700; font-size: 11px; letter-spacing: 1.5px; padding: 4px 9px; border-radius: 6px; border: 2px solid #000; text-transform: uppercase; }

/* ================================================================= LOS TRES TEMAS (21/10): cada perfil se ve como un tablero del juego
   body[data-tema] = feria · embrujada · espacial. La escena (#escena, #frente) la arma escena() con los objetos del juego. */
[data-tema="feria"] { --fondo: #8fd3ff; --t-txt: #2b1a3e; --t-suave: #5e4f6e; --t-panel: #fff6e5; --t-borde: #000; --t-brillo: #ffc83d; }
[data-tema="embrujada"] { --fondo: #120a20; --t-txt: #f2ecff; --t-suave: #b9a9c9; --t-panel: rgba(30,16,48,.86); --t-borde: #000; --t-brillo: #5cff9d; }
[data-tema="espacial"] { --fondo: #050818; --t-txt: #e6f6ff; --t-suave: #8fb3d9; --t-panel: rgba(10,22,58,.72); --t-borde: #3fe0ff; --t-brillo: #3fe0ff; }
body[data-tema] { background: var(--fondo); color: var(--t-txt); }
#escena { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
#escena .capa { position: absolute; inset: -60px; will-change: transform; }
#escena .p, #frente .p { position: absolute; will-change: transform; }
#frente { position: fixed; left: 0; right: 0; bottom: calc(74px + env(safe-area-inset-bottom)); height: 300px; z-index: 3; pointer-events: none; overflow: hidden; display: none; }
body.con-frente #frente { display: block; }
.app { z-index: 2; background: none; box-shadow: none; }
.top { position: relative; background: none; backdrop-filter: none; }
.main { position: relative; }

/* el letrero del tema, arriba de la tarjeta */
.letrero { text-align: center; margin: 2px 0 12px; }
.letrero b { display: block; font: normal clamp(28px, 8.6vw, 36px)/1 "Luckiest"; letter-spacing: 1px; }
.letrero span { display: inline-block; margin-top: 6px; font-weight: 700; font-size: 12px; letter-spacing: 3px; text-transform: uppercase; }
[data-tema="feria"] .letrero b { color: #fff; text-shadow: 0 4px 0 #e0162e, 0 8px 0 #000; }
[data-tema="feria"] .letrero span { background: #e0162e; color: #fff; padding: 5px 12px 3px; border: 2px solid #000; border-radius: 6px; box-shadow: 0 3px 0 #000; }
[data-tema="embrujada"] .letrero b { color: #b8ffd6; text-shadow: 0 0 6px #5cff9d, 0 0 18px #2bd46f, 0 0 36px #1e9e53, 0 4px 0 #0b2414; }
[data-tema="embrujada"] .letrero span { color: #d9c7ff; }
[data-tema="espacial"] .letrero b { color: #dff9ff; text-shadow: 0 0 8px #3fe0ff, 0 0 22px #1aa8d8, 0 0 44px #ff4fd8; }
[data-tema="espacial"] .letrero span { color: #9ff0ff; border: 1px solid rgba(63,224,255,.6); padding: 4px 10px; background: rgba(63,224,255,.08); }
.btn-tema { display: flex; align-items: center; gap: 8px; padding: 5px 12px 5px 5px; border-radius: 999px; border: 3px solid #000; font-weight: 700; font-size: 13px; box-shadow: 0 4px 0 #000; }
.btn-tema i { width: 26px; height: 26px; border-radius: 50%; border: 2px solid #000; background: #fff center/cover; }
[data-tema="feria"] .btn-tema { background: #ffc83d; color: #2b1a3e; }
[data-tema="embrujada"] .btn-tema { background: #1c0f30; color: #b8ffd6; box-shadow: 0 4px 0 #000, 0 0 14px rgba(92,255,157,.5); }
[data-tema="espacial"] .btn-tema { background: rgba(10,20,60,.8); color: #9ff0ff; border-color: #3fe0ff; box-shadow: 0 0 14px rgba(63,224,255,.6); }

/* ---------------------------------------------------------------- la tarjeta de cada tema */
.boleteria { position: relative; }
.ranura { position: relative; height: 18px; margin: 0 -6px; z-index: 4; border-radius: 9px; background: #05030a; border: 3px solid #000; box-shadow: 0 0 0 3px #ffc83d, 0 6px 0 #000, inset 0 4px 8px rgba(0,0,0,.9); display: none; }
[data-tema="feria"] .ranura { display: block; }
.salida { position: relative; padding-top: 16px; }
.escena3d { perspective: 900px; }
.ticket.viva { transform-style: preserve-3d; will-change: transform; }
.ticket.viva .holo { position: absolute; inset: 0; border-radius: 18px; pointer-events: none; z-index: 5; opacity: 0; mix-blend-mode: screen; }
.ticket.viva .brillo { position: absolute; inset: -8px; border-radius: 28px; pointer-events: none; z-index: -1; }
.ticket.viva.gano .brillo { animation: gano 2.2s ease-in-out infinite; }
@keyframes gano { 50% { box-shadow: 0 0 32px 8px var(--t-brillo); } }
.ticket.viva .racha { position: absolute; right: 20px; top: -19px; z-index: 9; display: flex; align-items: center; gap: 4px; background: #000; font: normal 15px/1 "Luckiest"; padding: 6px 9px 4px 6px; border-radius: 999px; transform-origin: 50% 100%; }
.ticket.viva .racha svg { width: 18px; height: 22px; }
.ticket.viva .av { width: 88px; height: 88px; }
.stats em { font-style: normal; display: inline-block; }
.luz { position: absolute; z-index: 8; transform: translate(-50%, -50%); pointer-events: none; }
[data-tema="feria"] .ticket.viva.gano .brillo { box-shadow: 0 0 18px 4px rgba(255,200,61,.6); }
[data-tema="feria"] .ticket.viva .racha { color: #ffc83d; }
[data-tema="feria"] .ticket.viva .holo { mix-blend-mode: color-dodge; }
[data-tema="feria"] .ticket.viva .av { background-color: #cfeaff; }
[data-tema="feria"] .luz { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid #000; background: #c08a1a; }
[data-tema="feria"] .luz.on { background: #fff3b0; box-shadow: 0 0 8px 3px rgba(255,220,90,.95); }
[data-tema="embrujada"] .ticket.viva { background: linear-gradient(180deg, #efe6d6, #d8cab0); box-shadow: 0 9px 0 #000, 0 0 40px rgba(92,255,157,.25); }
[data-tema="embrujada"] .ticket.viva .head { background: radial-gradient(ellipse 90% 120% at 20% 110%, rgba(92,255,157,.35), transparent 60%), linear-gradient(160deg, #4a1f70, #1c0f30); border-bottom-color: rgba(0,0,0,.45); }
[data-tema="embrujada"] .ticket.viva .name { color: #dfffe9; text-shadow: 0 0 10px rgba(92,255,157,.9), 0 3px 0 #000; }

[data-tema="embrujada"] .ticket.viva .no { color: rgba(255,255,255,.35); }
[data-tema="embrujada"] .ticket.viva .racha { color: #8dffb9; box-shadow: 0 0 12px rgba(92,255,157,.6); }
[data-tema="embrujada"] .ticket.viva .stats b { color: #3b1760; } [data-tema="embrujada"] .ticket.viva .stats b.oro { color: #d99a00; } [data-tema="embrujada"] .ticket.viva .stats span { color: #6e5a73; }

[data-tema="embrujada"] .luz { width: 10px; height: 18px; transform: translate(-50%, -100%); }
[data-tema="embrujada"] .luz::before { content: ""; position: absolute; left: 1px; right: 1px; bottom: 0; height: 9px; border-radius: 2px; background: #efe8d4; border: 1.5px solid #000; }
[data-tema="embrujada"] .luz i { position: absolute; left: 50%; bottom: 8px; width: 8px; height: 12px; margin-left: -4px; border-radius: 50% 50% 50% 50% / 65% 65% 35% 35%; opacity: 0;
  background: radial-gradient(circle at 50% 70%, #fff6c8 0, #ffd166 35%, #7cff9d 75%, transparent 76%); filter: drop-shadow(0 0 5px #8dffb0); transform-origin: 50% 100%; }
[data-tema="embrujada"] .luz.on i { opacity: 1; }
[data-tema="espacial"] .ticket.viva { background: linear-gradient(180deg, rgba(20,34,84,.82), rgba(8,14,40,.88)); color: #e6f6ff; border: 2px solid #3fe0ff; border-radius: 18px;
  box-shadow: 0 0 0 1px rgba(255,79,216,.5), 0 0 30px rgba(63,224,255,.35), inset 0 0 30px rgba(63,224,255,.15); backdrop-filter: blur(6px); }
[data-tema="espacial"] .ticket.viva::after { content: ""; position: absolute; inset: 0; border-radius: 16px; pointer-events: none; z-index: 4; background: repeating-linear-gradient(0deg, rgba(255,255,255,.05) 0 1px, transparent 1px 4px); }
[data-tema="espacial"] .ticket.viva .head { background: radial-gradient(ellipse 80% 120% at 90% -10%, rgba(255,79,216,.35), transparent 60%), linear-gradient(160deg, #1d2f7a, #0a1030); border-bottom: 1px solid rgba(63,224,255,.5); border-radius: 15px 15px 0 0; }

[data-tema="espacial"] .ticket.viva .stats b { color: #9ff0ff; text-shadow: 0 0 12px rgba(63,224,255,.8); } [data-tema="espacial"] .ticket.viva .stats b.oro { color: #ffd76a; text-shadow: 0 0 12px rgba(255,200,61,.8); }
[data-tema="espacial"] .ticket.viva .stats span { color: #8fb3d9; } [data-tema="espacial"] .ticket.viva .stats > div + div { border-left: 1px solid rgba(63,224,255,.3); }

[data-tema="espacial"] .luz.on { background: #bff7ff; box-shadow: 0 0 8px 2px #3fe0ff; }
.esquina { position: absolute; width: 18px; height: 18px; border: 0 solid #ff4fd8; z-index: 7; }

/* ---------------------------------------------------------------- Mr. Admin */
.admin-say .cerdo { position: relative; width: 74px; flex: none; transform-origin: 50% 100%; }
.admin-say .cerdo img { width: 100%; }
.admin-say .casco { position: absolute; left: -11px; top: -14px; width: 96px; display: none; filter: none; }

/* ---------------------------------------------------------------- los títulos de sección (h3) */
[data-tema] h3 { display: table; position: relative; margin: 38px auto 16px; text-align: center; font: normal 20px/1.1 "Luckiest"; letter-spacing: .8px; text-shadow: none; }
[data-tema] h3 small { display: block; margin: 6px 0 0; font: 600 12.5px "Fredoka"; letter-spacing: .3px; text-transform: none; }

[data-tema="feria"] h3::before { content: ""; position: absolute; left: -34px; right: -34px; top: -26px; height: 22px; border: 3px solid #000; border-bottom: 0; border-radius: 8px 8px 0 0; z-index: -1;
  background: repeating-linear-gradient(90deg, #e0162e 0 20px, #fff6e5 20px 40px); }

  background: radial-gradient(ellipse at 30% 20%, rgba(255,255,255,.12), transparent 60%), linear-gradient(180deg, #8c7fa3, #5a4d70); box-shadow: 0 6px 0 #000, inset 0 -8px 0 rgba(92,255,157,.25); }
[data-tema="embrujada"] h3 small { color: #20162d; text-shadow: none; }

[data-tema="espacial"] h3::before, [data-tema="espacial"] h3::after { content: ""; position: absolute; top: 50%; width: 46px; height: 1px; background: linear-gradient(90deg, transparent, #3fe0ff); }
[data-tema="espacial"] h3::before { right: 100%; } [data-tema="espacial"] h3::after { left: 100%; transform: scaleX(-1); }

[data-tema] .caja { background: var(--t-panel); }

[data-tema="feria"] .mj { background: #fff6e5; border: 3px solid #000; border-radius: 6px 6px 14px 14px; box-shadow: 0 5px 0 #000; margin-top: 16px; color: #2b1a3e; }
[data-tema="feria"] .mj::before { content: ""; position: absolute; left: -3px; right: -3px; top: -18px; height: 18px; border: 3px solid #000; border-bottom: 0; border-radius: 10px 10px 0 0;
  background: repeating-linear-gradient(90deg, var(--c1, #e0162e) 0 18px, #fff 18px 36px); }
[data-tema="feria"] .mj .th { border-radius: 10px; border: 3px solid #000; box-shadow: inset 0 0 0 3px #ffc83d; background-color: #4aa3ff; }

/* ---------------------------------------------------------------- revanchas: duelos con VS */
.duelos { display: grid; gap: 14px; }
.duelo { position: relative; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 12px 10px; }
.duelo .lado { display: flex; flex-direction: column; align-items: center; gap: 4px; font-weight: 700; font-size: 14px; text-align: center; min-width: 0; }
.duelo .lado a { color: inherit; text-decoration: none; }
.duelo .lado .av2 { width: 70px; height: 70px; border-radius: 50%; background: #fff center/cover; border: 3px solid #000; display: grid; place-items: center; font: normal 26px "Luckiest"; color: #fff; }
.duelo .vs { text-align: center; }
.duelo .vs b { display: block; font: normal 30px/1 "Luckiest"; }
.duelo .vs span { display: block; margin-top: 4px; font: normal 20px/1 "Luckiest"; }
.duelo .vs small { display: block; margin-top: 4px; font-weight: 700; font-size: 11.5px; letter-spacing: .5px; text-transform: uppercase; }
.gana { color: #2bd46f; } .pierde { color: #ff4e6a; }
[data-tema="feria"] .duelo { background: #ffc83d; border: 3px solid #000; border-radius: 14px; box-shadow: 0 5px 0 #000; color: #2b1a3e;
  background-image: repeating-conic-gradient(from 0deg at 50% 50%, rgba(255,255,255,.35) 0 10deg, transparent 10deg 20deg); }
[data-tema="feria"] .duelo .vs b { color: #e0162e; text-shadow: 0 3px 0 #000; -webkit-text-stroke: 1px #000; font-size: 34px; }
[data-tema="feria"] .duelo .vs span { background: #fff; border: 2px solid #000; border-radius: 8px; padding: 5px 8px 2px; }
[data-tema="feria"] .duelo .av2 { background-color: #cfeaff; }
[data-tema="feria"] .gana { color: #138a4a; } [data-tema="feria"] .pierde { color: #c0102a; }
[data-tema="embrujada"] .duelo { background: linear-gradient(180deg, rgba(40,20,64,.9), rgba(20,10,34,.92)); border: 3px solid #000; border-radius: 12px; box-shadow: 0 5px 0 #000, 0 0 20px rgba(92,255,157,.15); color: #e9dcff; }
[data-tema="embrujada"] .duelo .vs b { color: #5cff9d; text-shadow: 0 0 12px #5cff9d, 0 0 26px #2bd46f; }
[data-tema="embrujada"] .duelo .av2 { box-shadow: 0 0 0 3px #5cff9d, 0 0 16px rgba(92,255,157,.6); background-color: #2a1640; }
[data-tema="embrujada"] .duelo .lado.rival .av2 { box-shadow: 0 0 0 3px #c45cff, 0 0 16px rgba(196,92,255,.7); }
[data-tema="espacial"] .duelo { background: rgba(10,22,58,.66); border: 1.5px solid rgba(63,224,255,.55); border-radius: 14px; box-shadow: 0 0 18px rgba(63,224,255,.18); color: #e6f6ff; backdrop-filter: blur(4px); }
[data-tema="espacial"] .duelo .vs b { color: #fff; text-shadow: 0 0 10px #ff4fd8, 0 0 22px #ff4fd8; }
[data-tema="espacial"] .duelo .av2 { border: 2px solid #3fe0ff; box-shadow: 0 0 16px rgba(63,224,255,.7); background-color: #0b1640; }
[data-tema="espacial"] .duelo .lado.rival .av2 { border-color: #ff4fd8; box-shadow: 0 0 16px rgba(255,79,216,.7); }

/* ---------------------------------------------------------------- las partidas: talones, libro de visitas o bitácora */
.partidas { display: grid; gap: 10px; }
.pt { position: relative; display: flex; align-items: center; gap: 12px; padding: 10px 14px; }
.pt .lug { flex: none; width: 48px; height: 48px; display: grid; place-items: center; font: normal 19px/1 "Luckiest"; padding-top: 3px; }
.pt .n { flex: 1; min-width: 0; font-weight: 700; } .pt .n small { display: block; font-weight: 500; font-size: 13px; }
.pt .dor { display: flex; align-items: center; gap: 4px; font: normal 18px "Luckiest"; }
.pt .dor svg { width: 20px; height: 20px; }
[data-tema="feria"] .pt { background: #fff6e5; color: #2b1a3e; border: 3px solid #000; border-radius: 10px; box-shadow: 0 4px 0 #000;
  -webkit-mask: radial-gradient(circle 9px at 0 50%, transparent 9px, #000 9.5px) left/51% 100% no-repeat, radial-gradient(circle 9px at 100% 50%, transparent 9px, #000 9.5px) right/51% 100% no-repeat;
  mask: radial-gradient(circle 9px at 0 50%, transparent 9px, #000 9.5px) left/51% 100% no-repeat, radial-gradient(circle 9px at 100% 50%, transparent 9px, #000 9.5px) right/51% 100% no-repeat; }
[data-tema="feria"] .pt .lug { background: #4aa3ff; color: #fff; border: 3px solid #000; border-radius: 50%; text-shadow: 0 2px 0 #000; }
[data-tema="feria"] .pt .lug.l1 { background: #ffc83d; color: #2b1a3e; text-shadow: none; }
[data-tema="feria"] .pt .n small { color: #7c6d86; } [data-tema="feria"] .pt .dor { color: #e3a400; }
[data-tema="feria"] .pt::after { content: ""; position: absolute; right: 86px; top: 8px; bottom: 8px; border-left: 3px dotted rgba(0,0,0,.25); }
[data-tema="embrujada"] .pt { background: linear-gradient(90deg, #e9dcc0, #dccaa4); color: #2a1d17; border-radius: 4px; box-shadow: 0 4px 0 rgba(0,0,0,.6); border-left: 6px solid #4a1f70; }
[data-tema="embrujada"] .pt .lug { background: radial-gradient(circle at 40% 35%, #b2223c, #6a0f22); color: #ffe3e8; border-radius: 50%; box-shadow: 0 2px 0 #000, inset 0 0 0 3px rgba(255,255,255,.15); }
[data-tema="embrujada"] .pt .lug.l1 { background: radial-gradient(circle at 40% 35%, #3cff9a, #138a4a); color: #072414; }
[data-tema="embrujada"] .pt .n small { color: #6a5a4e; } [data-tema="embrujada"] .pt .dor { color: #b88400; }
[data-tema="espacial"] .pt { background: rgba(8,18,48,.72); color: #dff9ff; border: 1px solid rgba(63,224,255,.4); border-radius: 8px; }
[data-tema="espacial"] .pt .lug { border: 1.5px solid #3fe0ff; border-radius: 8px; color: #9ff0ff; text-shadow: 0 0 8px #3fe0ff; }
[data-tema="espacial"] .pt .lug.l1 { border-color: #ffd76a; color: #ffd76a; text-shadow: 0 0 8px #ffc83d; box-shadow: 0 0 14px rgba(255,200,61,.4); }
[data-tema="espacial"] .pt .n small { color: #8fb3d9; } [data-tema="espacial"] .pt .dor { color: #ffd76a; }
[data-tema="espacial"] .pt .led { position: absolute; left: -4px; top: 50%; width: 7px; height: 7px; margin-top: -3px; border-radius: 50%; background: #3fe0ff; box-shadow: 0 0 8px #3fe0ff; }

/* ---------------------------------------------------------------- pestañas */
[data-tema] .tabs { position: fixed; left: 50%; bottom: 0; transform: translateX(-50%); width: min(460px, 100%); z-index: 30; }
[data-tema] .main { padding-bottom: 110px; }
[data-tema="feria"] .tabs { background: repeating-linear-gradient(90deg, #e0162e 0 26px, #c40f25 26px 52px); border-top: 3px solid #000; }
[data-tema="feria"] .tabs button { color: #fff; } [data-tema="feria"] .tabs .on { color: #ffc83d; }
[data-tema="embrujada"] .tabs { background: linear-gradient(180deg, #3a2c52, #1b1229); border-top: 3px solid #000; box-shadow: 0 -6px 20px rgba(92,255,157,.12); }
[data-tema="embrujada"] .tabs button { color: #b9a9c9; } [data-tema="embrujada"] .tabs .on { color: #5cff9d; }
[data-tema="embrujada"] .tabs .mid i { background: #5cff9d; color: #0e2416; box-shadow: 0 0 18px rgba(92,255,157,.7); }
[data-tema="espacial"] .tabs { background: rgba(5,10,30,.86); border-top: 1px solid #3fe0ff; box-shadow: 0 -8px 24px rgba(63,224,255,.18); backdrop-filter: blur(8px); }
[data-tema="espacial"] .tabs button { color: #8fb3d9; } [data-tema="espacial"] .tabs .on { color: #9ff0ff; }
[data-tema="espacial"] .tabs .mid i { background: rgba(63,224,255,.16); border: 2px solid #3fe0ff; color: #9ff0ff; box-shadow: 0 0 18px rgba(63,224,255,.7); }

/* ---------------------------------------------------------------- elegir el tema */
.hoja { position: fixed; inset: 0; z-index: 60; display: flex; align-items: flex-end; justify-content: center; background: rgba(5,3,12,.66); }
.hoja .caja2 { width: min(460px, 100%); padding: 18px 16px calc(26px + env(safe-area-inset-bottom)); border-radius: 22px 22px 0 0; border: 3px solid #000; border-bottom: 0; background: #1a1028; color: #f2ecff; }
.hoja h2 { font: normal 24px "Luckiest"; text-align: center; margin: 0 0 4px; color: #ffc83d; }
.hoja p { text-align: center; color: #b9a9c9; font-size: 14px; margin: 0 0 14px; }
.opciones { display: grid; gap: 12px; }
.opt { position: relative; height: 92px; border-radius: 16px; border: 3px solid #000; overflow: hidden; text-align: left; padding: 0; box-shadow: 0 5px 0 #000; width: 100%; }
.opt .bg { position: absolute; inset: 0; }
.opt img { position: absolute; max-width: none; }
.opt b { position: absolute; z-index: 2; left: 14px; bottom: 12px; font: normal 22px/1 "Luckiest"; text-shadow: 0 3px 0 #000; color: #fff; text-transform: uppercase; }
.opt small { position: absolute; z-index: 2; left: 14px; bottom: 38px; font-weight: 700; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,.85); text-shadow: 0 2px 0 #000; }
.opt[aria-checked="true"] { outline: 4px solid #ffc83d; outline-offset: 2px; }
.opt.auto-opt { height: 56px; background: #2a1d3a; }
.opt.auto-opt b { bottom: 17px; font-size: 15px; right: 14px; } .opt.auto-opt small { display: none; }

/* ---------------------------------------------------------------- las entradas */
.cortina { position: fixed; inset: 0; z-index: 80; pointer-events: none; display: flex; }
.cortina i { flex: 1; height: 100%; background: repeating-linear-gradient(90deg, #5c0712 0 22px, #a30f22 34px, #c8182c 44px, #a30f22 54px, #5c0712 76px); box-shadow: inset 0 -26px 0 -6px #ffc83d; }
.flash { position: fixed; inset: 0; z-index: 79; pointer-events: none; opacity: 0; }
.tierra { position: fixed; left: 0; top: 0; width: 7px; height: 7px; border-radius: 2px; background: #3b2a1d; z-index: 5; pointer-events: none; }
.warp { position: fixed; inset: 0; z-index: 78; pointer-events: none; }
.cae { position: fixed; left: 0; top: 0; width: 26px; height: 26px; z-index: 50; pointer-events: none; }
@media (prefers-reduced-motion: reduce) { .mj .barra i { transition: none; } .ticket.viva.gano .brillo { animation: none; } }
/* ---------------------------------------------------------------- el historial y el resumen de una partida */
button.pt { width: 100%; text-align: left; font: inherit; cursor: pointer; }
button.pt:active { transform: translateY(2px); }
.pt .tit { display: inline-block; margin-top: 4px; font-weight: 700; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; padding: 2px 7px; border-radius: 6px; background: rgba(0,0,0,.12); }
.mas-partidas { margin-top: 14px; }
.resumen .volver { width: auto; padding: 8px 14px; margin: 4px 0 12px; font-size: 14px; }
.resumen .letrero b { font-size: clamp(22px, 6.6vw, 30px); text-transform: uppercase; }
.podio { display: grid; grid-template-columns: 1fr 1.15fr 1fr; align-items: end; gap: 8px; margin: 34px 0 6px; }
.pod { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; min-width: 0; }
.pod .av { width: 74px; height: 74px; margin-bottom: 6px; }
.pod.p1 .av { width: 94px; height: 94px; }
.pod .corona { position: absolute; top: -30px; width: 40px; z-index: 3; }
.pod .pn { font-weight: 700; font-size: 14px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pod .pn a { color: inherit; text-decoration: none; }
.pod .pn small { font-size: 11px; opacity: .7; }
.pod .pd { display: flex; align-items: center; gap: 3px; font: normal 16px "Luckiest"; margin: 2px 0 6px; }
.pod .pd svg { width: 18px; height: 18px; }
.pod .base { width: 100%; display: grid; place-items: center; }
.pod .base b { font: normal 34px/1 "Luckiest"; }
.pod.p1 .base { height: 110px; } .pod.p2 .base { height: 80px; } .pod.p3 .base { height: 58px; }
.pod.vacio-pod { visibility: hidden; }
[data-tema="feria"] .pod { color: #2b1a3e; }
[data-tema="feria"] .pod .base { border: 3px solid #000; border-radius: 8px 8px 0 0; box-shadow: 0 5px 0 #000; background: repeating-linear-gradient(90deg, #e0162e 0 16px, #fff6e5 16px 32px); }
[data-tema="feria"] .pod .base b { color: #fff; text-shadow: 0 3px 0 #000; -webkit-text-stroke: 1px #000; }
[data-tema="feria"] .pod.p1 .base { background: repeating-linear-gradient(90deg, #ffc83d 0 16px, #fff6e5 16px 32px); }
[data-tema="feria"] .pod .av { background-color: #cfeaff; }
[data-tema="feria"] .pod .pd { color: #e3a400; text-shadow: 0 2px 0 #000; }
[data-tema="embrujada"] .pod .base { border: 3px solid #000; border-radius: 40px 40px 6px 6px; background: radial-gradient(ellipse at 30% 15%, rgba(255,255,255,.14), transparent 60%), linear-gradient(180deg, #7d7196, #4e4366); box-shadow: 0 5px 0 #000, inset 0 -6px 0 rgba(92,255,157,.2); }
[data-tema="embrujada"] .pod .base b { color: #2a1d3a; text-shadow: 0 1px 0 rgba(255,255,255,.35); }
[data-tema="embrujada"] .pod.p1 .base b { color: #b8ffd6; text-shadow: 0 0 10px #5cff9d, 0 2px 0 #000; }
[data-tema="embrujada"] .pod .av { box-shadow: 0 0 0 3px #5cff9d, 0 0 16px rgba(92,255,157,.6); background-color: #2a1640; }
[data-tema="embrujada"] .pod .pd { color: #ffd76a; }
[data-tema="espacial"] .pod .base { border: 1.5px solid #3fe0ff; border-bottom: 0; border-radius: 12px 12px 0 0; background: linear-gradient(180deg, rgba(63,224,255,.28), rgba(10,22,58,.5)); box-shadow: 0 0 22px rgba(63,224,255,.35), inset 0 2px 0 rgba(255,255,255,.3); }
[data-tema="espacial"] .pod.p1 .base { border-color: #ffd76a; background: linear-gradient(180deg, rgba(255,215,106,.3), rgba(10,22,58,.5)); box-shadow: 0 0 26px rgba(255,200,61,.4); }
[data-tema="espacial"] .pod .base b { color: #dff9ff; text-shadow: 0 0 12px #3fe0ff; }
[data-tema="espacial"] .pod .av { border: 2px solid #3fe0ff; box-shadow: 0 0 18px rgba(63,224,255,.7); background-color: #0b1640; }
[data-tema="espacial"] .pod .pd { color: #ffd76a; }
.pod.yo .pn { text-decoration: underline 3px; text-underline-offset: 4px; }
.datos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.dato { display: flex; align-items: center; gap: 10px; padding: 10px; min-width: 0; }
.dato .a { width: 44px; height: 44px; flex: none; }
.dato b { display: block; font: normal 14.5px/1.15 "Luckiest"; letter-spacing: .3px; }
.dato small { display: block; font-weight: 600; font-size: 12px; margin-top: 3px; opacity: .8; }
.dato.chico b { font: 700 13.5px/1.2 "Fredoka"; }
[data-tema="feria"] .dato { background: #fff6e5; color: #2b1a3e; border: 3px solid #000; border-radius: 12px; box-shadow: 0 4px 0 #000; }
[data-tema="feria"] .dato:not(.chico) { background: #ffc83d; }
[data-tema="embrujada"] .dato { background: linear-gradient(180deg, #efe6d6, #d8cab0); color: #1a0f1f; border-radius: 6px 18px 6px 18px; box-shadow: 0 4px 0 #000; }
[data-tema="embrujada"] .dato:not(.chico) { background: linear-gradient(180deg, #3a1d5a, #1c0f30); color: #b8ffd6; box-shadow: 0 4px 0 #000, 0 0 14px rgba(92,255,157,.3); }
[data-tema="espacial"] .dato { background: rgba(10,22,58,.7); color: #dff9ff; border: 1px solid rgba(63,224,255,.45); border-radius: 10px; }
[data-tema="espacial"] .dato:not(.chico) { border-color: #ff4fd8; box-shadow: 0 0 14px rgba(255,79,216,.35); }
.fila-av { display: flex; align-items: center; gap: 4px; margin-top: 8px; }
.dato .a, .mini-av { border-radius: 50%; border: 2px solid #000; background: #fff center/cover; display: grid; place-items: center; font: normal 18px "Luckiest"; color: #fff; }
[data-tema="feria"] .dato .a, [data-tema="feria"] .mini-av { background-color: #cfeaff; } [data-tema="embrujada"] .dato .a, [data-tema="embrujada"] .mini-av { background-color: #2a1640; } [data-tema="espacial"] .dato .a, [data-tema="espacial"] .mini-av { background-color: #0b1640; border-color: #3fe0ff; }
.mini-av { width: 30px !important; height: 30px !important; border-width: 2px !important; font-size: 13px !important; opacity: .55; }
.mini-av.gana-av { opacity: 1; width: 36px !important; height: 36px !important; box-shadow: 0 0 0 2px #ffc83d; }
.ronda .pct { font-size: 20px; }
/* ---------------------------------------------------------------- los logros: la vitrina y las medallas */
.vitrina { position: relative; padding: 18px 10px 12px; margin-top: 4px; }
.meds { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px 6px; }
.med { --tier: #3a3346; position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; background: none; border: 0; padding: 0; font: inherit; color: inherit; cursor: pointer; min-width: 0; }
.med.n1 { --tier: #d0874a; } .med.n2 { --tier: #d9e2ee; } .med.n3 { --tier: #ffc83d; }
.med .aro { position: relative; width: 66px; height: 66px; border-radius: 50%; display: grid; place-items: center; overflow: hidden; box-shadow: 0 0 0 4px var(--tier), 0 5px 0 4px #000; transition: transform .15s; }
.med:active .aro { transform: scale(.94); }
.med .aro img { width: 82%; height: 82%; object-fit: contain; filter: drop-shadow(0 3px 2px rgba(0,0,0,.35)); }
.med .aro img[src*="/j_"] { width: 100%; height: 100%; object-fit: cover; filter: none; }
.med .aro img[src*="admin_"] { width: 96%; height: 96%; object-position: 50% 15%; }
.med.n0 .aro img { filter: brightness(0) opacity(.32); }
.med.n0 .aro img[src*="/j_"] { filter: grayscale(1) brightness(.35); }
.med.n3 .aro::after { content: ""; position: absolute; inset: -20%; background: linear-gradient(115deg, transparent 40%, rgba(255,255,255,.75) 50%, transparent 60%); animation: brilloMed 3.2s ease-in-out infinite; }
@keyframes brilloMed { 0%, 55% { transform: translateX(-70%); } 85%, 100% { transform: translateX(70%); } }
.med .q { font: normal 30px/1 "Luckiest"; opacity: .7; }
.med .mn { font-weight: 700; font-size: 11.5px; line-height: 1.15; text-align: center; max-width: 100%; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.med.n0 .mn { opacity: .6; }
.pips { display: flex; gap: 3px; margin-top: -2px; }
.pips i { width: 8px; height: 8px; border-radius: 50%; background: rgba(0,0,0,.28); border: 1.5px solid #000; }
.pips i.on.n1 { background: #d0874a; } .pips i.on.n2 { background: #d9e2ee; } .pips i.on.n3 { background: #ffc83d; box-shadow: 0 0 6px #ffc83d; }
.med.nuevo .aro { animation: medNueva 1.1s cubic-bezier(.2,1.6,.4,1) both, medBrilla 1.6s 1.1s ease-in-out 3; }
@keyframes medNueva { 0% { transform: translateY(-60px) scale(1.6) rotate(-25deg); opacity: 0; } 60% { opacity: 1; } 100% { transform: none; } }
@keyframes medBrilla { 50% { box-shadow: 0 0 0 4px var(--tier), 0 5px 0 4px #000, 0 0 28px 10px var(--tier); } }
/* feria: rosetas en una caseta de premios */
[data-tema="feria"] .vitrina { background: #fff6e5; border: 3px solid #000; border-radius: 8px 8px 16px 16px; box-shadow: 0 5px 0 #000; color: #2b1a3e; margin-top: 22px;
  background-image: repeating-linear-gradient(180deg, transparent 0 118px, #e8d6b4 118px 124px); }
[data-tema="feria"] .vitrina::before { content: ""; position: absolute; left: -3px; right: -3px; top: -20px; height: 20px; border: 3px solid #000; border-bottom: 0; border-radius: 10px 10px 0 0; background: repeating-linear-gradient(90deg, #e0162e 0 18px, #fff 18px 36px); }
[data-tema="feria"] .med .aro { background: radial-gradient(circle at 35% 30%, #fff, #ffe9b8); }
[data-tema="feria"] .med:not(.n0) .aro::before { content: ""; position: absolute; inset: 3px; border-radius: 50%; border: 2px dashed rgba(0,0,0,.18); }
[data-tema="feria"] .med.n0 .aro { background: #e9dcc4; }
/* embrujada: nichos de la cripta */
[data-tema="embrujada"] .vitrina { background: linear-gradient(180deg, rgba(40,20,64,.92), rgba(16,8,28,.94)); border: 3px solid #000; border-radius: 60px 60px 12px 12px; box-shadow: 0 5px 0 #000, 0 0 24px rgba(92,255,157,.15); padding-top: 26px; }
[data-tema="embrujada"] .med .aro { border-radius: 34px 34px 8px 8px; background: radial-gradient(ellipse at 30% 15%, rgba(255,255,255,.14), transparent 60%), linear-gradient(180deg, #7d7196, #4e4366); box-shadow: 0 0 0 3px var(--tier), 0 5px 0 3px #000; }
[data-tema="embrujada"] .med:not(.n0) .aro { box-shadow: 0 0 0 3px var(--tier), 0 5px 0 3px #000, 0 0 18px rgba(92,255,157,.35); }
[data-tema="embrujada"] .med.n0 .aro { background: #2a1d3a; }
[data-tema="embrujada"] .med .mn { color: #e9dcff; } [data-tema="embrujada"] .pips i { background: rgba(255,255,255,.12); }
/* espacial: cápsulas de neón */
[data-tema="espacial"] .vitrina { background: rgba(10,22,58,.66); border: 1.5px solid rgba(63,224,255,.55); border-radius: 16px; box-shadow: 0 0 18px rgba(63,224,255,.2); backdrop-filter: blur(4px); color: #e6f6ff; }
[data-tema="espacial"] .med .aro { background: radial-gradient(circle at 40% 30%, #1d2f7a, #070d2a); box-shadow: 0 0 0 2px var(--tier), 0 0 18px color-mix(in srgb, var(--tier) 70%, transparent); }
[data-tema="espacial"] .med.n0 .aro { box-shadow: 0 0 0 1.5px rgba(63,224,255,.35); }

.ficha .avance small { display: block; margin-top: 6px; color: #d9c7ff; font-weight: 700; }

async function api(metodo, ruta, cuerpo) {
  if (DEMO) return demoApi(metodo, ruta, cuerpo);
  const r = await fetch(API + ruta, {
    method: metodo,
    headers: { "Content-Type": "application/json", ...(S.token ? { Authorization: "Bearer " + S.token } : {}) },

  if (!r.ok) throw Object.assign(new Error(data.error || "error"), { status: r.status });

  return { partida: { id, fecha: u.fecha, modo: u.modo, turnos: u.turnos, en_linea: u.en_linea, jugadores: jugadores.length, mapa: u.mapa, completa: true }, jugadores, rondas };

async function demoApi(metodo, ruta, cuerpo) {
  DATOS ??= (await import("./demo.js")).DEMO;
  await new Promise((r) => setTimeout(r, 300));
  const vacio = q.get("demo") === "vacio";
  const res = () => vacio ? DATOS.vacio : conHistorial(DATOS.resumen);
  const yo = () => { const j = guardado.get("ps_demo_jugador"); return j ? JSON.parse(j) : null; };
  const falla = (c) => { throw Object.assign(new Error(c), { status: 400 }); };
  if (!AM) {
    AM = structuredClone(DATOS.amigos);
    if (vacio) { AM.tabla = AM.tabla.filter((x) => x.yo); AM.recibidas = []; AM.enviadas = []; AM.tabla[0].partidas = AM.tabla[0].victorias = AM.tabla[0].dorados = 0; }
  }
  const mio = AM.tabla.find((x) => x.yo);
  if (yo()) Object.assign(mio, { nombre: yo().nombre, personaje: yo().personaje });
  const gente = () => [...AM.tabla.filter((x) => !x.yo), ...AM.recibidas, ...AM.enviadas, ...AM.sugerencias, OTRO_DEMO];
  const quien = (c) => gente().find((x) => x.codigo === norm(c));
  const sacar = (lista, c) => { const i = AM[lista].findIndex((x) => x.codigo === norm(c)); return i >= 0 ? AM[lista].splice(i, 1)[0] : null; };
  const amigo = (p) => ({ codigo: p.codigo, nombre: p.nombre, personaje: p.personaje, yo: false, partidas: 0, victorias: 0, dorados: 0 });
  const relacion = (c) => AM.tabla.some((x) => !x.yo && x.codigo === c) ? "amigos" : AM.enviadas.some((x) => x.codigo === c) ? "enviada" : AM.recibidas.some((x) => x.codigo === c) ? "recibida" : null;
  if (ruta === "/entrar") return { token: "demo", jugador: yo(), resumen: yo() ? res() : null };
  if (ruta === "/yo" && metodo === "GET") return { jugador: yo(), resumen: yo() ? res() : null };
  if (ruta === "/yo") { const j = { codigo: MIO_DEMO, nombre: cuerpo.nombre.trim(), personaje: cuerpo.personaje, tema: cuerpo.tema ?? yo()?.tema ?? "auto" }; guardado.set("ps_demo_jugador", JSON.stringify(j)); return { jugador: j, resumen: res() }; }
  if (ruta === "/salir") return { ok: true };
  if (ruta.startsWith("/jugador/")) {
    const n = norm(ruta.split("/")[2]);
    if (n === MIO_DEMO && yo()) return { jugador: yo(), resumen: res(), relacion: "yo" };
    const p = quien(n) ?? falla("no_existe");
    return { jugador: { codigo: p.codigo, nombre: p.nombre, personaje: p.personaje, tema: p.tema ?? "auto" }, resumen: { ...conHistorial(DATOS.resumen), rivales: DATOS.resumen.rivales.filter((r) => r.codigo !== n) }, relacion: S.token ? relacion(n) : null };
  }
  if (ruta.startsWith("/partida/")) return demoPartida(ruta.split("/")[2], yo());
  if (ruta === "/amigos") return structuredClone(AM);
  if (ruta.startsWith("/vincular/")) return metodo === "GET" ? { estado: q.get("demo") === "otra" ? "esperando" : "esperando", otra_cuenta: q.get("demo") === "otra" } : { ok: true };
  if (ruta.startsWith("/asiento/")) return metodo === "GET" ? { puesto: 3, de: { codigo: "RKU2Q7", nombre: "Razziel", personaje: "dragon" }, estado: "libre", es_tu_pc: false } : { ok: true, puesto: 3 };
  if (ruta === "/amigos/agregar") {
    const n = norm(cuerpo.codigo);
    if (n === MIO_DEMO) falla("tu_mismo");
    const p = quien(n) ?? falla("no_existe");
    const jugador = { codigo: p.codigo, nombre: p.nombre, personaje: p.personaje };
    if (relacion(n) === "recibida") { sacar("recibidas", n); AM.tabla.push(amigo(p)); return { relacion: "amigos", jugador }; }
    if (relacion(n)) return { relacion: relacion(n), jugador };
    sacar("sugerencias", n); AM.enviadas.push(jugador);
    return { relacion: "enviada", jugador };
  }
  if (ruta === "/amigos/responder") {
    const p = sacar("recibidas", cuerpo.codigo);
    if (p && cuerpo.aceptar) AM.tabla.push(amigo(p));
    return { relacion: p && cuerpo.aceptar ? "amigos" : null };
  }
  if (ruta === "/amigos/quitar") {
    sacar("enviadas", cuerpo.codigo);
    const i = AM.tabla.findIndex((x) => !x.yo && x.codigo === norm(cuerpo.codigo));
    if (i >= 0) AM.tabla.splice(i, 1);
    return { relacion: null };
  }
  falla("no_existe");
}

// ================================================================= arranque
async function arrancar() {
  document.documentElement.lang = lang;
  document.title = t("titulo_pag");
  if (!API && !DEMO) return pintar(vistaPronto());
  // ¿viene de vuelta de Steam?
  if (q.get("openid.mode")) {
    pintar(vistaCargando(t("hablando")));
    const openid = {};
    for (const [k, v] of q) if (k.startsWith("openid.")) openid[k] = v;
    limpiarUrl();
    if (openid["openid.mode"] !== "id_res") { S.error = t("err_steam"); return pintar(vistaEntrar()); }
    try {
      const r = await api("POST", "/entrar", { openid });
      S.token = r.token; guardado.set("ps_token", r.token);
      S.jugador = r.jugador; S.resumen = r.resumen;
      return S.jugador ? mostrarPerfil() : pintar(vistaCrear());
    } catch (e) {
      S.error = e.status ? t("err_steam") : t("err_red");
      return pintar(vistaEntrar());
    }
  }
  // ¿el perfil de otro? (?j=<ID>)
  const jq = (q.get("j") || "").toUpperCase().replace(/[\s-]/g, "");
  if (/^[A-HJKMNP-Z2-9]{6}$/.test(jq)) {
    pintar(vistaCargando(t("cargando")));
    try { S.publico = await api("GET", "/jugador/" + jq); return pintar(vistaPublico()); }
    catch (e) { S.error = e.message === "no_existe" ? t("err_no_existe") : t("err_red"); return pintar(vistaEntrar()); }
  }
  if (!S.token) return pintar(vistaEntrar());
  pintar(vistaCargando(t("cargando")));
  try {
    const r = await api("GET", "/yo");
    S.jugador = r.jugador; S.resumen = r.resumen;
    S.jugador ? mostrarPerfil() : pintar(vistaCrear());
  } catch (e) {
    if (e.status === 401) { salirLocal(); return pintar(vistaEntrar()); }
    S.error = t("err_red"); pintar(vistaEntrar());
  }
}

function irASteam() {
  if (DEMO) { location.search = "?" + new URLSearchParams({ ...Object.fromEntries(q), "openid.mode": "id_res" }); return; }
  const vuelta = location.origin + location.pathname;
  const p = new URLSearchParams({
    "openid.ns": "http://specs.openid.net/auth/2.0",
    "openid.mode": "checkid_setup",
    "openid.return_to": vuelta,
    "openid.realm": location.origin,
    "openid.identity": "http://specs.openid.net/auth/2.0/identifier_select",
    "openid.claimed_id": "http://specs.openid.net/auth/2.0/identifier_select",
  });
  location.href = STEAM + "?" + p;
}

function limpiarUrl() {
  const p = new URLSearchParams();
  for (const k of ["lang", "demo"]) if (q.has(k)) p.set(k, q.get(k));
  for (const k of ["vincular", "asiento"]) q.delete(k);
  for (const k of [...q.keys()]) if (k.startsWith("openid.")) q.delete(k);
  history.replaceState(null, "", location.pathname + (p.size ? "?" + p : ""));
}

// Trae la pestaña Amigos por detrás (para la insignia de solicitudes) y la repinta si está abierta.
async function cargarAmigos() {
  try {
    S.amigos = await api("GET", "/amigos");
  } catch (e) {
    if (e.status === 401) { salirLocal(); return pintar(vistaEntrar()); }
    S.amigos ??= { error: true };
  }
  if (!S.jugador || S.publico || document.getElementById("form-perfil")) return;
  if (S.tab === "amigos") pintar(vistaPerfil(), false);
  else ponerInsignia();
}

function ponerInsignia() {
  const b = app.querySelector('[data-tab="amigos"]');
  const n = S.amigos?.recibidas?.length ?? 0;
  b?.querySelector(".insignia")?.remove();
  if (b && n) b.insertAdjacentHTML("beforeend", `<span class="insignia" aria-label="${n}">${n}</span>`);
}

// ================================================================= pintar
function pintar(html, arriba = true) {
  app.innerHTML = html + (DEMO ? `<div class="demo">${t("demo")}</div>` : "");
  vestir();
  conectar();
  ponerInsignia();
  if (arriba) window.scrollTo(0, 0);
  vida();
}

let VIDA = null;
function vida() {
  if (VIDA) VIDA.extras.forEach((e) => e.remove());
  VIDA = null;
  const cajas = app.querySelectorAll(".mj");
  if (!MOV || !("IntersectionObserver" in window)) cajas.forEach((c) => { c.classList.add("visto"); c.dataset.visto = 0; });
  else {
    const io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add("visto"); e.target.dataset.visto = performance.now(); io.unobserve(e.target); } }), { threshold: 0.35 });
    cajas.forEach((c) => io.observe(c));
  }
  const card = app.querySelector("[data-viva]");
  if (!card) return;

  const w = card.offsetWidth, h = card.offsetHeight, pts = [];

  else { const paso = tema === "feria" ? 21 : 16, m = 16; for (let x = m; x <= w - m; x += paso) pts.push([x, 2]); for (let y = m; y <= h - m; y += paso) pts.push([w - 2, y]); for (let x = w - m; x >= m; x -= paso) pts.push([x, h - 2]); for (let y = h - m; y >= m; y -= paso) pts.push([2, y]); }
  for (const [x, y] of pts) { const b = document.createElement("span"); b.className = "luz"; b.innerHTML = tema === "embrujada" ? "<i></i>" : ""; b.style.left = x + "px"; b.style.top = y + "px"; b.dataset.f = azar() * 10; card.appendChild(b); focos.push(b); }
  const V = { card, tema, focos, extras: [], t0: performance.now(), e3d: card.parentElement, salida: card.closest(".salida"),

function _tarjetaViva(V, ahora) {
  if (!document.contains(V.card)) { V.extras.forEach((e) => e.remove()); VIDA = null; return; }
  const t = (ahora - V.t0) / 1000, L = V.listo, tema = V.tema;
  // la entrada de cada tema
  if (V.entrada) {
    if (tema === "feria") {
      if (V.cortina) { const a = _ease(_tramo(t, 0.35, 1.45)); V.cortina.children[0].style.transform = `translateX(${-a * 102}%)`; V.cortina.children[1].style.transform = `translateX(${a * 102}%)`; if (t > 1.6) { V.cortina.remove(); V.cortina = null; } }
      const s = _tramo(t, 1.2, 2.4);
      V.salida.style.clipPath = s < 1 ? "inset(0 -60px -90px -60px)" : "";
      V.e3d.style.transform = s < 1 ? `translateY(${-105 + 105 * _back(s)}%) translateX(${Math.sin(t * 90) * 1.2 * (1 - s)}px)` : "";
    }
    if (tema === "embrujada") {
      if (V.negro) V.negro.style.opacity = 1 - _tramo(t, 0.25, 0.9);
      if (V.rayo) V.rayo.style.opacity = t > 0.3 && t < 0.75 ? (Math.sin((t - 0.3) * 40) > 0 ? 0.9 : 0.15) * (1 - _tramo(t, 0.3, 0.75)) : 0;
      const s = _tramo(t, 0.9, 2.4);
      V.e3d.style.transform = s < 1 ? `translateY(${560 - 560 * _back(s)}px) translateX(${Math.sin(t * 70) * 2.5 * (1 - s)}px) rotate(${(1 - _ease(s)) * -6}deg)` : "";
      for (const p of V.tierra) { const k = t - p.t0; if (k < 0 || k > 1.3) { p.e.style.opacity = 0; continue; } p.e.style.opacity = 1 - k / 1.3; p.e.style.transform = `translate(${p.x + p.vx * k}px, ${innerHeight * 0.62 + p.vy * k + 520 * k * k}px) rotate(${k * 400}deg)`; }
    }
    if (tema === "espacial") {
      if (V.warp) { const k = _tramo(t, 0, 1.3); V.warp.style.opacity = 1 - _tramo(t, 1.1, 1.5); [...V.warp.children].forEach((s) => { const a = Number(s.dataset.a), v = Number(s.dataset.v), d = k * k * innerWidth * v; s.style.transform = `translate(${Math.cos(a) * d}px, ${Math.sin(a) * d}px) rotate(${a}rad)`; s.style.width = 2 + k * 90 * v + "px"; }); if (t > 1.6) { V.warp.remove(); V.warp = null; } }
      if (V.rayo) V.rayo.style.opacity = t > 1.2 && t < 1.6 ? 0.8 * (1 - _tramo(t, 1.2, 1.6)) : 0;
      const s = _tramo(t, 1.3, 2.4);
      V.e3d.style.opacity = t < 1.3 ? 0 : s < 1 ? (Math.sin(t * 60) > -0.3 ? 1 : 0.4) : 1;
      V.e3d.style.transform = s < 1 ? `scaleY(${0.02 + 0.98 * _ease(s)}) scaleX(${1 + (1 - _ease(s)) * 0.1})` : "";
    }
    if (V.caen) { const d = V.dorados.getBoundingClientRect(); for (const c of V.caen) { const k = _tramo(t, c.t0, c.t0 + 0.9); if (k <= 0 || k >= 1) { c.e.style.opacity = 0; continue; } c.e.style.opacity = k < 0.85 ? 1 : (1 - k) / 0.15; c.e.style.transform = `translate(${c.x0 + (d.left + d.width / 2 - 13 - c.x0) * _ease(k)}px, ${-30 + (d.top + 34) * k * k}px) rotate(${c.g * k}deg) scale(${1 - 0.4 * k})`; } }
  }
  if (tema === "espacial" && (!V.entrada || t > 2.4)) V.e3d.style.transform = `translateY(${Math.sin(t * 1.1) * 6}px)`;     // (gravedad cero)
  // los números cuentan y dan un saltito
  V.nums.forEach((n, i) => {
    const k = _tramo(t, L + 0.1 + i * 0.12, L + 1.2 + i * 0.12);
    n.textContent = Math.round(Number(n.dataset.n) * _ease(k));
    const pop = _tramo(t, L + 1.2 + i * 0.12, L + 1.55 + i * 0.12);
    n.style.transform = pop > 0 && pop < 1 ? `scale(${1 + 0.35 * Math.sin(pop * Math.PI)})` : "";
  });
  // el título como un sello y la racha
  if (V.pill) { const p = _tramo(t, L + 1.3, L + 1.65); V.pill.style.opacity = p > 0 ? 1 : 0; V.pill.style.transform = p >= 1 ? "" : `scale(${2.4 - 1.4 * _ease(p)}) rotate(${-12 * (1 - _ease(p))}deg)`; }
  if (V.racha) { const q = _tramo(t, L + 1.6, L + 2); V.racha.style.opacity = q > 0 ? 1 : 0; V.racha.style.transform = `scale(${_back(q)}) rotate(${Math.sin(t * 7) * 4 * q}deg)`; }
  // la inclinación con el brillo del tema
  const h = _ease(_tramo(t, L + 0.9, L + 1.8)), ix = h * MANO.sx, iy = h * MANO.sy;
  V.card.style.transform = `rotateX(${ix * 7}deg) rotateY(${iy * 10}deg)`;
  const pos = 50 + iy * 45;
  const col = tema === "feria" ? ["rgba(255,120,210,.5)", "rgba(255,255,255,.85)", "rgba(90,220,255,.5)"] : tema === "embrujada" ? ["rgba(92,255,157,.35)", "rgba(230,255,240,.55)", "rgba(196,92,255,.35)"] : ["rgba(63,224,255,.35)", "rgba(230,255,255,.6)", "rgba(255,79,216,.35)"];
  V.holo.style.opacity = 0.5 * h;
  V.holo.style.background = `linear-gradient(${115 + ix * 20}deg, transparent ${pos - 36}%, ${col[0]} ${pos - 14}%, ${col[1]} ${pos}%, ${col[2]} ${pos + 14}%, transparent ${pos + 36}%)`;
  // las luces del borde
  const paso = Math.floor(t * (tema === "feria" ? 8 : 12)), cada = tema === "feria" ? 4 : 6;
  V.focos.forEach((b, i) => {
    if (tema === "embrujada") { b.classList.toggle("on", t > L + i * 0.07); const f = Number(b.dataset.f); b.firstChild.style.transform = `scale(${0.85 + 0.25 * Math.abs(Math.sin(t * 9 + f))}, ${0.9 + 0.3 * Math.abs(Math.sin(t * 13 + f))}) rotate(${Math.sin(t * 7 + f) * 8}deg)`; }
    else b.classList.toggle("on", t > L - 0.1 && ((paso - i) % cada + cada) % cada === 0);
  });
  // Mr. Admin escribe
  if (V.burbuja && V.frase) {
    const letras = Math.floor(Math.max(0, t - L - 1.5) * 30);
    if (letras < V.frase.length) V.burbuja.innerHTML = esc(V.frase.slice(0, letras)) + '<span class="cursor"></span>';
    else if (V.burbuja.dataset.escrita !== "1") { V.burbuja.textContent = V.frase; V.burbuja.dataset.escrita = "1"; }
    const risa = t > L + 1.5 && letras < V.frase.length + 20 ? Math.abs(Math.sin(t * 14)) * 0.06 : 0;
    if (V.cerdo) V.cerdo.style.transform = `scale(${1 + risa}, ${1 - risa}) rotate(${Math.sin(t * 2) * 3}deg)`;
  }
}

// un solo motor para todo: la escena (capas, objetos que se mueven) y la tarjeta
function motor(ahora) {
  const vaiven = MANO.on ? 0.3 : 1, t = (ahora - ESC.t0) / 1000;
  MANO.sx += ((MANO.on ? MANO.x : 0) + vaiven * (Math.sin(t * 1.2) + Math.sin(t * 2.6) * 0.3) - MANO.sx) * 0.08;
  MANO.sy += ((MANO.on ? MANO.y : 0) + vaiven * (Math.cos(t * 0.9) + Math.sin(t * 2.1) * 0.35) - MANO.sy) * 0.08;
  const sc = scrollY;
  for (const [c, k] of ESC.capas) c.style.transform = `translate(${MANO.sy * k}px, ${MANO.sx * k * 0.6 - sc * k * 0.012}px)`;
  const F = document.getElementById("frente");
  F.style.transform = `translateY(${sc * 1.4}px)`;
  F.style.opacity = Math.max(0, 1 - sc / 260);
  ESC.ticks.forEach((f) => f(t));
  if (VIDA) _tarjetaViva(VIDA, ahora);
  // las órbitas de los planetas (espacial): el arco es el porcentaje
  document.querySelectorAll(".mj.visto .arco").forEach((c) => {
    const m = c.closest(".mj"), k = _ease(Math.min(1, (ahora - Number(m.dataset.visto)) / 1200)), p = (Number(c.dataset.p) / 100) * 214 * k;
    c.setAttribute("stroke-dasharray", `${p} 214`);
    const ang = -Math.PI / 2 + (p / 214) * Math.PI * 2, s = m.querySelector(".sat");
    s.setAttribute("cx", 38 + Math.cos(ang) * 34); s.setAttribute("cy", 38 + Math.sin(ang) * 34);
  });
  // las velas de las lápidas (embrujada)
  document.querySelectorAll(".mj .luz i").forEach((v, i) => (v.style.transform = `scale(${0.85 + 0.25 * Math.abs(Math.sin(t * 9 + i))}, ${0.9 + 0.3 * Math.abs(Math.sin(t * 13 + i * 2))})`));
  requestAnimationFrame(motor);
}
if (MOV) requestAnimationFrame(motor);
else addEventListener("scroll", () => { const F = document.getElementById("frente"); F.style.opacity = Math.max(0, 1 - scrollY / 260); });

// La hoja para cambiar el tema desde el perfil: se guarda al tocar uno.
function abrirHoja() {
  const j = S.jugador;
  const H = document.createElement("div");
  H.className = "hoja"; H.setAttribute("role", "dialog"); H.setAttribute("aria-modal", "true");
  H.innerHTML = `<div class="caja2"><h2>${t("tema_h")}</h2><p>${t("tema_p")}</p>${opcionesTema(j.tema || "auto", j.personaje)}</div>`;
  const cerrar = () => { H.remove(); document.removeEventListener("keydown", tecla); };
  const tecla = (e) => { if (e.key === "Escape") cerrar(); };
  H.addEventListener("click", async (e) => {
    const b = e.target.closest("[data-tema-opt]");
    if (!b) { if (e.target === H) cerrar(); return; }
    H.querySelectorAll("[data-tema-opt]").forEach((x) => (x.disabled = true));
    try {
      const r = await api("POST", "/yo", { nombre: j.nombre, personaje: j.personaje, tema: b.dataset.temaOpt });
      S.jugador = r.jugador; S.resumen = r.resumen ?? S.resumen;
      cerrar(); pintar(vistaPerfil());
    } catch (err) {
      cerrar();
      if (err.status === 401) { salirLocal(); return pintar(vistaEntrar()); }
      aviso(t("err_red"));

  });
  document.addEventListener("keydown", tecla);
  document.body.appendChild(H);

}

// La tarjeta del tema: ticket de feria, ticket de ultratumba o pase de tripulante. `boleteria` = la del perfil
// propio: sale impresa de la ranura (o de la tumba, o del teletransporte) la primera vez del día. La anima vida().
function tarjeta(j, r, boleteria = false) {
  const titulo = r?.titulo && TITULOS[r.titulo] ? TITULOS[r.titulo][lang === "es" ? 0 : 1] : (r?.partidas ? t("cliente") : t("nuevo"));
  let racha = 0;     // (las últimas partidas ganadas seguidas)
  for (const p of r?.ultimas ?? []) { if (p.lugar !== 1) break; racha++; }
  const gano = r?.ultimas?.[0]?.lugar === 1;
  const num = (n) => `<em data-n="${n ?? 0}">${n ?? 0}</em>`;
  const esquinas = TEMA !== "espacial" ? "" : [["left:-6px;top:-6px", "3px 0 0 3px", "6px 0 0 0"], ["right:-6px;top:-6px", "3px 3px 0 0", "0 6px 0 0"], ["left:-6px;bottom:-6px", "0 0 3px 3px", "0 0 0 6px"], ["right:-6px;bottom:-6px", "0 3px 3px 0", "0 0 6px 0"]]
    .map(([p, b, rr]) => `<i class="esquina" style="${p};border-width:${b};border-radius:${rr}"></i>`).join("");
  const fuego = { feria: "#ff6a1a", embrujada: "#2bd46f", espacial: "#3fe0ff" }[TEMA];
  const card = `<div class="escena3d"><div class="ticket viva${gano ? " gano" : ""}" data-viva>${esquinas}
    <div class="brillo"></div>
    <div class="head">${avatar("av", j.personaje, j.nombre)}
      <div class="who"><div class="name d">${esc(j.nombre)}</div><span class="pill">${esc(titulo)}</span></div>
      <span class="no">ID ${idv(j.codigo)}</span>
      ${racha >= 2 ? `<span class="racha"><svg aria-hidden="true" style="color:${fuego}"><use href="#i-fuego"/></svg>${esc(t("racha", racha))}</span>` : ""}
      <i class="muesca i"></i><i class="muesca d"></i>
    </div>
    <div class="stats">
      <div><b>${num(r?.partidas)}</b><span>${t("partidas")}</span></div>
      <div><b>${num(r?.victorias)}</b><span>${t("victorias")}</span></div>
      <div><b class="oro" data-dorados>${ticketIcon}${num(r?.dorados)}</b><span>${t("dorados")}</span></div>
    </div>
    <div class="holo"></div>
  </div></div>`;
  if (!boleteria) return card;
  return `<div class="boleteria"><div class="ranura" aria-hidden="true"></div><div class="salida">${card}</div></div>`;
}

// Los minijuegos: los 3 donde más ganas y los 3 donde más pierdes (puestos de feria, lápidas o planetas, según el
// tema) y, al tocar el botón, todos los que jugaste. Sin partidas, los espacios vacíos. Acepta el resumen viejo.
function bloqueMinijuegos(r, titulo = t("tus_mj")) {
  const M = r?.minijuegos ?? {};
  const mejores = M.mejores ?? (M.fuerte ? [M.fuerte] : []);
  const peores = M.peores ?? (M.ruina ? [M.ruina] : []);
  const todos = M.todos ?? [...mejores, ...peores];
  const [ibien, imal] = TEMA_INFO[TEMA].iconos;
  const sub = (txt, icono, malo = false) => `<div class="sub-mj${malo ? " malo" : ""}">${icono ? `<img src="tema/${TEMA}/${icono}.webp" alt="">` : ""}${esc(txt)}</div>`;
  const fila = (m, i, malo) => {
    const pct = Math.round((100 * m.ganados) / m.jugados);
    malo ??= pct < 34;
    const foto = FOTOS[m.id] ? ` style="background-image:url(../media/j_${FOTOS[m.id]}.jpg)"` : "";
    const orbita = TEMA === "espacial" ? `<svg class="orbita" viewBox="0 0 76 76" aria-hidden="true"><circle cx="38" cy="38" r="34" fill="none" stroke="rgba(63,224,255,.18)" stroke-width="2"/><circle class="arco" cx="38" cy="38" r="34" fill="none" stroke="${malo ? "#ff4fd8" : "#3fe0ff"}" stroke-width="3" stroke-linecap="round" stroke-dasharray="${MOV ? 0 : (pct / 100) * 214} 214" transform="rotate(-90 38 38)" data-p="${pct}"/><circle class="sat" r="4" fill="#fff" cx="38" cy="4"/></svg>` : "";
    const vela = TEMA === "embrujada" ? `<span class="luz on" aria-hidden="true"><i></i></span>` : "";
    return `<div class="mj${malo ? " malo" : ""}" style="--p:${pct}%;--c1:${["#e0162e", "#3d8bff", "#2fcb86"][i % 3]}">${orbita}${vela}
      <div class="th"${foto}>${foto ? "" : esc([...nombreMj(m.id).replace(/^[¡¿]/, "")][0])}</div>
      <div class="n">${esc(nombreMj(m.id))}<small>${t("ganados", m.ganados, m.jugados)}</small><div class="barra"><i></i></div></div>
      <span class="pct">${pct}%</span></div>`;
  };
  let h = `<h3>${titulo}</h3>`;
  if (!mejores.length) {
    const hueco = `<div class="mj hueco"><div class="th"></div><div class="n"><i></i><small><i></i></small></div><span class="pct">–</span></div>`;
    return h + sub(ti("bien"), ibien) + `<div class="mjs">${hueco.repeat(3)}</div><p class="nota">${t("mj_vacio")}</p>`;
  }
  h += sub(ti("bien"), ibien) + `<div class="mjs">${mejores.map((m, i) => fila(m, i, false)).join("")}</div>`;
  if (peores.length) h += sub(ti("mal"), imal, true) + `<div class="mjs">${peores.map((m, i) => fila(m, i, true)).join("")}</div>`;
  if (todos.length > mejores.length + peores.length) {
    if (S.verTodos) h += sub(t("mj_todos")) + `<div class="mjs">${todos.map((m, i) => fila(m, i)).join("")}</div>`;
    h += `<button class="btn btn-ghost ver-todos" data-accion="ver_todos">${S.verTodos ? t("mj_menos") : t("mj_ver_todos", todos.length)}</button>`;
  }
  return h;
}

// Contra quién juegas más, como duelos: tú, el VS con el marcador, y el rival.
function bloqueRivales(r, j = S.jugador) {
  if (!r?.rivales?.length) return "";
  const duelos = r.rivales.map((x) => {
    const d = x.ganadas - x.perdidas;
    const txt = d > 0 ? `<small class="gana">${esc(t("llevas", d))}</small>` : d < 0 ? `<small class="pierde">${esc(t("te_lleva", -d))}</small>` : `<small>${esc(t("empate"))}</small>`;
    const nombre = x.codigo ? `<a href="?j=${x.codigo}">${esc(x.nombre)}</a>` : esc(x.nombre);
    return `<div class="duelo"><div class="lado">${avatar("av2", j.personaje, j.nombre)}${t("yo_lado")}</div>
      <div class="vs"><b>VS</b><span>${x.ganadas}–${x.perdidas}</span>${txt}</div>
      <div class="lado rival">${avatar("av2", x.personaje, x.nombre)}${nombre}</div></div>`;
  }).join("");
  return `<h3>${esc(ti("duelos"))} <small>${t("revanchas_sub")}</small></h3><div class="duelos">${duelos}</div>`;
}

  }
  if (A.recibidas.length) {

      `<div class="fila-mini"><button class="mini si" data-accion="aceptar" data-c="${p.codigo}">${t("aceptar")}</button><button class="mini gris" data-accion="rechazar" data-c="${p.codigo}">${t("rechazar")}</button></div>`)).join("") + `</div>`;

    <form class="agregar-num" id="form-agregar" novalidate><input class="campo" id="num-amigo" maxlength="7" autocomplete="off" autocapitalize="characters" spellcheck="false" style="text-transform:uppercase" placeholder="${t("num_lbl")}" aria-label="${t("num_lbl")}"><button class="btn btn-oro" type="submit">${t("agregar")}</button></form>
    <p class="pista" id="pista-amigo">${t("tu_numero", idv(S.jugador.codigo))}</p>
    <div class="fila-btn"><button class="btn btn-ghost" data-accion="mi_qr">${t("mi_qr")}</button><button class="btn btn-ghost" data-accion="compartir">${t("mi_enlace")}</button></div></div>`;

    h += `<h3>${t("steam_h")}</h3>`;
    if (A.sugerencias.length) h += `<div class="caja">` + A.sugerencias.map((p) => fila(p, `<button class="mini oro" data-accion="agregar" data-c="${p.codigo}">${t("agregar")}</button>`)).join("") + `</div>`;
    else h += `<p class="nota" style="margin-top:0">${A.steam === "privada" ? t("steam_privada") : t("steam_nadie")}</p>`;
  }
  if (A.enviadas.length) {
    h += `<h3>${t("enviadas_h")}</h3><div class="caja">` + A.enviadas.map((p) => fila(p, `<button class="mini gris" data-accion="quitar" data-c="${p.codigo}">${t("cancelar_sol")}</button>`)).join("") + `</div>`;
  }
  return h;
}

// Lo que pasa al tocar Agregar, Aceptar, No, Cancelar o Quitar (en la pestaña o en el perfil de otro).
async function accionAmigo(ruta, cuerpo, boton) {
  if (boton) boton.disabled = true;
  try {
    const r = await api("POST", ruta, cuerpo);
    if (ruta === "/amigos/agregar") aviso(r.relacion === "amigos" ? t("ok_amigos", r.jugador.nombre) : t("ok_enviada", r.jugador.nombre));
    else if (ruta === "/amigos/quitar") aviso(t("ok_quitado"));
    if (S.publico) { S.publico.relacion = r.relacion; S.amigos = null; return pintar(vistaPublico(), false); }
    await cargarAmigos();
    return r;
  } catch (e) {
    if (boton) boton.disabled = false;
    if (e.status === 401) { salirLocal(); return pintar(vistaEntrar()); }
    const msg = { no_existe: t("err_num"), tu_mismo: t("err_tu_mismo"), demasiados: t("err_demasiados"), sin_perfil: t("err_sin_perfil") }[e.message] ?? t("err_red");
    const pista = document.getElementById("pista-amigo");
    if (pista) { pista.className = "pista mal"; pista.textContent = msg; } else aviso(msg);
  }
}

async function mostrarQr() {
  if (!window.qrcode) await new Promise((ok, mal) => { const s = document.createElement("script"); s.src = "qrcode.js"; s.onload = ok; s.onerror = mal; document.head.appendChild(s); }).catch(() => {});
  if (!window.qrcode) return aviso(t("err_red"));
  const url = location.origin + location.pathname + "?j=" + S.jugador.codigo + "&agregar=1";
  const qr = window.qrcode(0, "M");
  qr.addData(url);
  qr.make();
  const j = S.jugador;
  const m = document.createElement("div");
  m.className = "modal";
  m.setAttribute("role", "dialog");
  m.setAttribute("aria-modal", "true");
  m.innerHTML = `<div class="ticket"><div class="head">${avatar("av", j.personaje, j.nombre)}<div class="name d" style="font-size:30px;color:#fff;text-shadow:0 3px 0 #000">${esc(j.nombre)}</div>
    <span class="no">ID ${idv(j.codigo)}</span><i class="muesca i"></i><i class="muesca d"></i></div>
    <div class="qr">${qr.createSvgTag({ cellSize: 6, margin: 0, scalable: true })}</div><p>${t("qr_p")}</p>
    <button class="btn btn-oro" type="button">${t("cerrar")}</button></div>`;
  const cerrar = () => { m.remove(); document.removeEventListener("keydown", esc_); };
  const esc_ = (e) => { if (e.key === "Escape") cerrar(); };
  m.addEventListener("click", (e) => { if (e.target === m || e.target.closest(".btn")) cerrar(); });
  document.addEventListener("keydown", esc_);
  document.body.appendChild(m);
  m.querySelector(".btn").focus();
}
